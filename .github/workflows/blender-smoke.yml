name: Blender smoke

on:
  pull_request:
    paths:
      - '.github/workflows/blender-smoke.yml'
      # Cały tools/ci, nie pojedynczy skrypt: te joby uruchamiają też
      # apt_install.sh, listy pakietów i (w tunnel-alignment) vehicle_clearance.sh.
      # Przy wąskim wzorcu zmiana takiego pliku nie odpalała własnego CI.
      - 'tools/ci/**'
      - 'tools/blender/**'
      - 'tools/track/**'
      - 'tools/tests/**'
      - 'doctor.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-smoke:
    # Ten job chodzi na MASZYNIE WŁAŚCICIELA, nie na jednorazowej maszynie GitHuba.
    # Kroki wykonują kod ze sprawdzonego refa — `tools/**`, `doctor.sh`, skrypty CI —
    # więc bez tego warunku wystarczyłby pull request z forka, żeby uruchomić tam
    # dowolny kod. `metro.brussels` jest prywatne, ale ma WŁĄCZONE forkowanie
    # (`allow_forking: true`), więc uzasadnienie „forka nie da się zrobić" tu nie
    # obowiązuje. Warunek nosi KAŻDY job; `needs:` nie jest zamiennikiem, bo job
    # dopisany bez łańcucha zależności nie miałby żadnej ochrony.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Workspace self-hosted runnera JEST WSPÓŁDZIELONY między przebiegami — inaczej
      # niż jednorazowa maszyna GitHuba, która zawsze startuje pusta.
      #
      # Dla tego projektu to nie jest drobiazg, tylko dziura w samej weryfikacji:
      # `CLAUDE.md` §5 mówi, że skrypt bez błędu potrafi wyprodukować pustą scenę,
      # więc bramki sprawdzają PLIKI WYJŚCIOWE. Plik z poprzedniego przebiegu
      # przechodzi te bramki tak samo dobrze jak świeży — job byłby zielony,
      # nie wygenerowawszy niczego.
      #
      # Sprzątaniem zajmuje się samo `actions/checkout`: jego wejście `clean`
      # ma domyślnie `true`, czyli wykonuje `git clean -ffdx && git reset --hard HEAD`,
      # a `-x` obejmuje pliki ignorowane — więc `build/` i `renders/` znikają.
      # Ten krok NIE sprząta, tylko to SPRAWDZA: gdyby ktoś ustawił `clean: false`
      # albo usunął checkout, bramki zaczęłyby oglądać stare wyjścia i nikt by się
      # o tym nie dowiedział. Zaklęcie „rm -rf" nie odróżniłoby tych dwóch sytuacji.
      - name: Workspace jest czysty po checkoucie
        shell: bash
        run: |
          set -euo pipefail
          stale=""
          for path in build renders; do
            [ -e "$path" ] && stale="$stale $path"
          done
          if [ -n "$stale" ]; then
            echo "::error::wyjścia z poprzedniego przebiegu przetrwały checkout:$stale"
            echo "Sprawdź, czy actions/checkout nie ma clean: false — bramki tego"
            echo "projektu sprawdzają pliki wyjściowe i stary plik je przejdzie."
            ls -la $stale
            exit 1
          fi
          echo "build/ i renders/ nie istnieją — bramki zobaczą wyłącznie to, co powstanie w tym przebiegu"

      # `tools/ci/blender_smoke.sh` uruchamia `doctor.sh`, a ten wymaga SDK .NET
      # i odpala `dotnet test tests/Sim.Tests`. Bez tego kroku job jechał na tym,
      # co akurat zastał — kiedyś na obrazie GitHuba, dziś na maszynie właściciela.
      # Pin jest ten sam co w sim-tests.yml.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # Na jednorazowej maszynie GitHuba Blender trzeba było instalować za każdym
      # razem — 162 pakiety, 190 MB. Na maszynie właściciela zostaje zainstalowany,
      # więc instalacja przy każdym przebiegu byłaby marnotrawstwem i niepotrzebnym
      # `sudo`. Ten krok sprawdza, czy jest; instalacja i cache odpalają się tylko,
      # gdy go brak. Świeży runner nadal działa bez ręcznego przygotowania.
      - name: Czy biblioteki systemowe renderu już są
        id: tools
        shell: bash
        # Sonda pyta o BIBLIOTEKI, nie o Blendera, i to jest zmiana względem poprzedniej
        # wersji tego kroku. Blender nie przychodzi już z apt — przychodzi z przypiętego
        # tarballa przez `tools/ci/blender_install.sh`, który sam sprawdza, czy w jego
        # katalogu stoi WŁAŚCIWA WERSJA, i sam jest tanią operacją, gdy stoi (zmierzone:
        # 0,12 s). Sonda na `command -v blender` byłaby tu wręcz szkodliwa: na maszynie,
        # która kiedykolwiek dostała Blendera z apt, znalazłaby 4.0.2 i uznała
        # środowisko za gotowe — a 4.0.2 to legacy EEVEE, czyli rendery nieporównywalne
        # z baseline'em. Z apt zostają wyłącznie biblioteki, których tarball nie wozi.
        run: |
          set -euo pipefail
          missing=""
          ldconfig -p | grep -q 'libEGL\.so\.1' || missing="$missing libEGL.so.1"
          if [ -z "$missing" ]; then
            echo "libs=present" >> "$GITHUB_OUTPUT"
            echo "biblioteki renderu są na miejscu"
          else
            echo "libs=missing" >> "$GITHUB_OUTPUT"
            echo "brakuje:$missing — krok instalacji je doinstaluje"
          fi

      - name: Cache pakietów apt
        if: steps.tools.outputs.libs == 'missing'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/metro-apt
          key: apt-${{ runner.os }}-blender-${{ hashFiles('tools/ci/apt-packages/blender.txt') }}
          restore-keys: apt-${{ runner.os }}-blender-

      - name: Install render libraries
        if: steps.tools.outputs.libs == 'missing'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export APT_CACHE_DIR="$HOME/.cache/metro-apt"
          bash tools/ci/apt_install.sh --set blender
          # Bramka, nie ozdoba: pod `pipefail` brak biblioteki kończy krok błędem.
          # Poprzednia wersja miała tu `|| true`, czyli wypisywała i przemilczała.
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1'

      # Blender w PRZYPIĘTEJ wersji, z oficjalnego tarballa, POZA workspace.
      #
      # Bez `if:`, i to jest celowe. Skrypt jest własną sondą: czyta numer z
      # `tools/ci/blender-version.txt`, porównuje go z tym, co faktycznie stoi w jego
      # katalogu, i pobiera tylko przy rozjeździe. Gdy wersja się zgadza, kończy w 0,12 s.
      # Bramkowanie tego `if:` z workflow oznaczałoby drugą, słabszą sondę obok mocnej.
      #
      # Katalog jest poza workspace, bo `actions/checkout` robi `git clean -ffdx`,
      # a `-x` obejmuje pliki ignorowane — Blender w workspace schodziłby z sieci
      # (366 MB) raz na przebieg. Ta sama decyzja i ten sam katalog co przy Godocie.
      - name: Blender w przypiętej wersji
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bin="$(bash tools/ci/blender_install.sh)"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version | sed -n '1,2p'
          "$bin" --background --python-expr 'import numpy; print("numpy", numpy.__version__)'

      - name: Run Blender smoke and negative tests
        shell: bash
        run: bash tools/ci/blender_smoke.sh

      - name: Upload T-010 verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t-010-blender-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/t010/report.txt
            build/t010/*.log
            build/TEST.glb
            renders/TEST_iso.png
            renders/TEST_side.png
            renders/TEST_inside.png
