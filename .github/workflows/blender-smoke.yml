name: Blender smoke

on:
  pull_request:
    paths:
      - '.github/workflows/blender-smoke.yml'
      # Cały tools/ci, nie pojedynczy skrypt: te joby uruchamiają też
      # apt_install.sh, listy pakietów i (w tunnel-alignment) vehicle_clearance.sh.
      # Przy wąskim wzorcu zmiana takiego pliku nie odpalała własnego CI.
      - 'tools/ci/**'
      - 'tools/blender/**'
      - 'tools/track/**'
      - 'tools/tests/**'
      - 'doctor.sh'
      # Katalog akcji lokalnych, z tego samego powodu co `tools/ci/**` wyżej —
      # 6.D78. Ten job wykonuje treść `.github/actions/*/action.yml` tak samo, jak
      # wykonuje skrypty z `tools/ci/`, a bez tego wzorca zmiana akcji nie odpalała
      # ani jednego joba, który jej używa. Zmierzone 09.09.2026: siedem workflowów
      # z filtrem, siedem luk. Sonda narzędzi nie miała ANI JEDNEGO konsumenta bez
      # filtra, więc jej zmiana nie była przed scaleniem wykonywana wcale.
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-smoke:
    # Zgodnie z polityką repo job nie uruchamia kodu z pull requestów forków.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        # 6.D108: PEŁNA historia, nie domyślna głębokość 1 — decyzja właściciela
        # z 10.09.2026. `tools/tests/test_report_claims.py` rozstrzyga, czy zdanie
        # raportu mówi o wartości BIEŻĄCEJ stałej, czy o wartości Z DNIA POMIARU,
        # po dacie ostatniej zmiany tej stałej w gicie. Przy głębokości 1 nie ma
        # czego przeszukać: KAŻDA stała wygląda wtedy na zmienioną w jedynym
        # widocznym commicie, więc przyrząd odpowiadałby, nie sprawdziwszy niczego.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Kontrola czystego workspace: JEDNA implementacja w
      # `.github/actions/check-workspace`, nie kopia w każdym workflow. Powód
      # i mechanika są w samej akcji.
      - name: Workspace jest czysty po checkoucie
        uses: ./.github/actions/check-workspace

      # `tools/ci/blender_smoke.sh` uruchamia `doctor.sh`, a ten wymaga SDK .NET
      # i odpala `dotnet test tests/Sim.Tests`. Bez tego kroku job jechał na tym,
      # co akurat zastał — kiedyś na obrazie GitHuba, dziś na maszynie właściciela.
      # Pin jest ten sam co w sim-tests.yml.
      # `setup-dotnet` domyślnie instaluje do `/usr/share/dotnet`, a runner
      # właściciela nie ma tam prawa zapisu — cały krok kończył się serią
      # `mkdir: Permission denied` i `cp: cannot create directory
      # '/usr/share/dotnet/sdk/10.0.400/': Permission denied`. Na jednorazowej
      # maszynie GitHuba działało, bo tam runner jest rootem.
      #
      # Katalog idzie więc tam, gdzie już leży Godot: `RUNNER_TOOL_CACHE`, czyli
      # `_tool`, rodzeństwo workspace'u. Załatwia to dwie rzeczy naraz — prawa
      # zapisu ORAZ przetrwanie `git clean -ffdx` z `actions/checkout`.
      #
      # `runner.tool_cache` NIE działa w `env:` na poziomie workflow ani joba
      # (GitHub odrzuca wtedy cały workflow), więc zmienna powstaje w kroku.
      - name: Katalog SDK poza /usr/share i poza workspace
        shell: bash
        run: |
          set -euo pipefail
          cache="${RUNNER_TOOL_CACHE:-$HOME/.cache/metro-tools}"
          dir="$cache/metro-dotnet"
          case "$dir" in
            "$GITHUB_WORKSPACE"/*)
              echo "::error::katalog SDK $dir leży W WORKSPACE — checkout skasuje go przy następnym przebiegu"
              exit 1
              ;;
            /usr/*)
              echo "::error::katalog SDK $dir leży w /usr — runner nie ma tam prawa zapisu"
              exit 1
              ;;
          esac
          mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"
          echo "SDK poleci do $dir"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'

      # Sonda narzędzi: JEDNA implementacja w `.github/actions/probe-tools`.
      # Wyjście `libs` ma tę samą umowę co przed wydzieleniem, więc warunki
      # `if: steps.tools.outputs.libs == 'missing'` niżej zostają bez zmian.
      - name: Czy biblioteki systemowe renderu już są
        id: tools
        uses: ./.github/actions/probe-tools
        with:
          # `libXcursor.so.1` i `libwayland-cursor.so.0` dopisane 16.09.2026 (6.D243)
          # i są tu WE WSZYSTKICH SIEDMIU KOPIACH, choć potrzebuje ich jeden job.
          # Kursora żąda wyłącznie `godot-first-run`, na kroku 41 — pierwszym, który
          # woła silnik z serwerem wyświetlania zamiast headless. Iden­tyczność wszystkich
          # kopii jest jednak OCHRONĄ z 6.D44, a nie porządkiem: rozluźnienie jej do
          # „każda kopia jest nadzbiorem bazy” otwiera z powrotem dziurę, przez którą
          # ZAWĘŻONA sonda melduje `present` i pomija instalację. Dwa pakiety więcej
          # na maszynie, która kursora nie używa, kosztują mniej niż ta dziura.
          libraries: libEGL.so.1 libGL.so.1 libX11.so.6 libXext.so.6 libXrender.so.1 libXfixes.so.3 libXi.so.6 libxkbcommon.so.0 libICE.so.6 libSM.so.6 libXcursor.so.1 libwayland-cursor.so.0
          commands: curl xz
          python-modules: yaml

      - name: Cache pakietów apt
        if: steps.tools.outputs.libs == 'missing'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/metro-apt
          key: apt-${{ runner.os }}-blender-${{ hashFiles('tools/ci/apt-packages/blender.txt') }}
          restore-keys: apt-${{ runner.os }}-blender-

      - name: Install render libraries
        if: steps.tools.outputs.libs == 'missing'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export APT_CACHE_DIR="$HOME/.cache/metro-apt"
          bash tools/ci/apt_install.sh --set blender
          # Bramka, nie ozdoba: pod `pipefail` brak biblioteki kończy krok błędem.
          # Poprzednia wersja miała tu `|| true`, czyli wypisywała i przemilczała.
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1'

      # Blender w PRZYPIĘTEJ wersji, z oficjalnego tarballa, POZA workspace.
      #
      # Bez `if:`, i to jest celowe. Skrypt jest własną sondą: czyta numer z
      # `tools/ci/blender-version.txt`, porównuje go z tym, co faktycznie stoi w jego
      # katalogu, i pobiera tylko przy rozjeździe. Gdy wersja się zgadza, kończy w 0,12 s.
      # Bramkowanie tego `if:` z workflow oznaczałoby drugą, słabszą sondę obok mocnej.
      #
      # Katalog jest poza workspace, bo `actions/checkout` robi `git clean -ffdx`,
      # a `-x` obejmuje pliki ignorowane — Blender w workspace schodziłby z sieci
      # (366 MB) raz na przebieg. Ta sama decyzja i ten sam katalog co przy Godocie.
      - name: Blender w przypiętej wersji
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bin="$(bash tools/ci/blender_install.sh)"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version | sed -n '1,2p'
          "$bin" --background --python-expr 'import numpy; print("numpy", numpy.__version__)'

      - name: Run Blender smoke and negative tests
        shell: bash
        run: bash tools/ci/blender_smoke.sh

      - name: Upload T-010 verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t-010-blender-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/t010/report.txt
            build/t010/*.log
            build/TEST.glb
            renders/TEST_iso.png
            renders/TEST_side.png
            renders/TEST_inside.png
