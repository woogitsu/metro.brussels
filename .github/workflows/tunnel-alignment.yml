name: Tunnel alignment

on:
  pull_request:
    paths:
      - '.github/workflows/tunnel-alignment.yml'
      - 'tools/blender/**'
      - 'tools/visual/**'
      # Cały tools/ci, nie pojedynczy skrypt: te joby uruchamiają też
      # apt_install.sh, listy pakietów i (w tunnel-alignment) vehicle_clearance.sh.
      # Przy wąskim wzorcu zmiana takiego pliku nie odpalała własnego CI.
      - 'tools/ci/**'
      - 'tools/tests/**'
      - 'data/track/**'
      - 'reports/L1_A-geometry.md'
      - 'reports/L1_A-chunks.md'
      - 'reports/L1_A-lod.md'
      - 'reports/M7-in-tunnel.md'
      - 'reports/M7-clearance-profile.md'
      - 'reports/clearance-BE.md'
      - 'reports/packages-BE-tunnels.md'
      - 'reports/surface-vs-tunnel.md'
      - 'data/vehicle/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tunnel-alignment:
    # Ten job chodzi na MASZYNIE WŁAŚCICIELA, nie na jednorazowej maszynie GitHuba.
    # Kroki wykonują kod ze sprawdzonego refa — `tools/**`, `doctor.sh`, skrypty CI —
    # więc bez tego warunku wystarczyłby pull request z forka, żeby uruchomić tam
    # dowolny kod. `metro.brussels` jest prywatne, ale ma WŁĄCZONE forkowanie
    # (`allow_forking: true`), więc uzasadnienie „forka nie da się zrobić" tu nie
    # obowiązuje. Warunek nosi KAŻDY job; `needs:` nie jest zamiennikiem, bo job
    # dopisany bez łańcucha zależności nie miałby żadnej ochrony.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 45

    strategy:
      # Porażka jednego pakietu nie ma anulować pozostałych: chcemy wiedzieć, czy
      # to jeden pakiet, czy cała generacja.
      fail-fast: false
      matrix:
        # Tylko pakiety, w których ŻADNE z dwóch niezależnych źródeł nie stawia
        # zamkniętej rury na odcinku poza tunelem (reports/surface-vs-tunnel.md §3):
        # A 1,8 %, B 0,0 %, E 2,7 % punktów poza tunelem i zero punktów, w których
        # UrbIS zawyżałby tunel. C ma 8,6 %, D 69,8 %, F 22,7 % — tam model zamkniętej
        # rury byłby świadomie nieprawdziwy na setkach metrów.
        axis: [L1_A, L1_B, L2_E]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Kontrola czystego workspace: JEDNA implementacja w
      # `.github/actions/check-workspace`, nie kopia w każdym workflow. Powód
      # i mechanika są w samej akcji.
      - name: Workspace jest czysty po checkoucie
        uses: ./.github/actions/check-workspace

      # Sonda narzędzi: JEDNA implementacja w `.github/actions/probe-tools`.
      # Wyjście `libs` ma tę samą umowę co przed wydzieleniem, więc warunki
      # `if: steps.tools.outputs.libs == 'missing'` niżej zostają bez zmian.
      - name: Czy biblioteki systemowe renderu już są
        id: tools
        uses: ./.github/actions/probe-tools
        with:
          libraries: libEGL.so.1

      - name: Cache pakietów apt
        if: steps.tools.outputs.libs == 'missing'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/metro-apt
          key: apt-${{ runner.os }}-blender-${{ hashFiles('tools/ci/apt-packages/blender.txt') }}
          restore-keys: apt-${{ runner.os }}-blender-

      - name: Install render libraries
        if: steps.tools.outputs.libs == 'missing'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export APT_CACHE_DIR="$HOME/.cache/metro-apt"
          bash tools/ci/apt_install.sh --set blender
          # Bramka, nie ozdoba: pod `pipefail` brak biblioteki kończy krok błędem.
          # Poprzednia wersja miała tu `|| true`, czyli wypisywała i przemilczała.
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1'

      # Blender w PRZYPIĘTEJ wersji, z oficjalnego tarballa, POZA workspace.
      #
      # Bez `if:`, i to jest celowe. Skrypt jest własną sondą: czyta numer z
      # `tools/ci/blender-version.txt`, porównuje go z tym, co faktycznie stoi w jego
      # katalogu, i pobiera tylko przy rozjeździe. Gdy wersja się zgadza, kończy w 0,12 s.
      # Bramkowanie tego `if:` z workflow oznaczałoby drugą, słabszą sondę obok mocnej.
      #
      # Katalog jest poza workspace, bo `actions/checkout` robi `git clean -ffdx`,
      # a `-x` obejmuje pliki ignorowane — Blender w workspace schodziłby z sieci
      # (366 MB) raz na przebieg. Ta sama decyzja i ten sam katalog co przy Godocie.
      - name: Blender w przypiętej wersji
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bin="$(bash tools/ci/blender_install.sh)"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version | sed -n '1,2p'
          "$bin" --background --python-expr 'import numpy; print("numpy", numpy.__version__)'

      - name: Generate and verify the ${{ matrix.axis }} tunnel
        shell: bash
        run: bash tools/ci/tunnel_alignment.sh ${{ matrix.axis }}

      - name: Measure M7 clearance inside the generated tunnel
        shell: bash
        run: bash tools/ci/vehicle_clearance.sh ${{ matrix.axis }}

      - name: Upload T-210 verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t-210-tunnel-${{ matrix.axis }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/t210/${{ matrix.axis }}/report.txt
            build/t210/${{ matrix.axis }}/*.json
            build/t210/${{ matrix.axis }}/*.md
            build/t210/${{ matrix.axis }}/*.log
            build/t210/${{ matrix.axis }}/renders/**
            build/t220clearance/${{ matrix.axis }}/report.txt
            build/t220clearance/${{ matrix.axis }}/*.json
            build/t220clearance/${{ matrix.axis }}/*.md
            build/t220clearance/${{ matrix.axis }}/*.log
            build/t220clearance/${{ matrix.axis }}/renders/**
