name: Python tool tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    # Ten job chodzi na MASZYNIE WŁAŚCICIELA, nie na jednorazowej maszynie GitHuba.
    # Kroki wykonują kod ze sprawdzonego refa — `tools/**`, `doctor.sh`, skrypty CI —
    # więc bez tego warunku wystarczyłby pull request z forka, żeby uruchomić tam
    # dowolny kod. `metro.brussels` jest prywatne, ale ma WŁĄCZONE forkowanie
    # (`allow_forking: true`), więc uzasadnienie „forka nie da się zrobić" tu nie
    # obowiązuje. Warunek nosi KAŻDY job; `needs:` nie jest zamiennikiem, bo job
    # dopisany bez łańcucha zależności nie miałby żadnej ochrony.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        # 6.D108: PEŁNA historia, nie domyślna głębokość 1 — decyzja właściciela
        # z 10.09.2026. `tools/tests/test_report_claims.py` rozstrzyga, czy zdanie
        # raportu mówi o wartości BIEŻĄCEJ stałej, czy o wartości Z DNIA POMIARU,
        # po dacie ostatniej zmiany tej stałej w gicie. Przy głębokości 1 nie ma
        # czego przeszukać: KAŻDA stała wygląda wtedy na zmienioną w jedynym
        # widocznym commicie, więc przyrząd odpowiadałby, nie sprawdziwszy niczego.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Kontrola czystego workspace: JEDNA implementacja w
      # `.github/actions/check-workspace`, nie kopia w każdym workflow. Powód
      # i mechanika są w samej akcji.
      - name: Workspace jest czysty po checkoucie
        uses: ./.github/actions/check-workspace

      - name: Verify Python
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          python3 --version

      - name: Compile Python tools
        shell: bash
        run: python3 -m compileall -q tools

      - name: Run tool tests
        shell: bash
        # 6.D11: ten sam krok mierzy CZAS ŚCIANY całego procesu obok poprawności.
        # Zestaw jest bramką KAŻDEGO PR-a i do 06.09.2026 nikt tego czasu nie
        # pilnował, mimo że rośnie z każdym zadaniem.
        #
        # Kod wyjścia `test_all.py` zostaje WYŁĄCZNIE o poprawności testów —
        # `tools/tests/mutation_sweep.py` (`run_suite`) czyta z tego procesu
        # TYLKO linię `N/M przeszło` i kod wyjścia, i bierze zero + równość za
        # PRZEŻYCIE mutacji. Gdyby kod wyjścia zależał też od czasu, zwykłe
        # spowolnienie maszyny zamieniłoby się w falę fałszywych „zabić" — dlatego
        # próg jest sprawdzany TU, w bash, PO zakończeniu procesu, a nie przez
        # zmianę `return` w `main()`.
        #
        # Próg NIE jest wpisany tu z ręki: `tools/tests/test_suite_runtime_budget.py`
        # niesie `SUITE_RUNTIME_BUDGET_S`, jedno miejsce prawdy z uzasadnieniem
        # marginesu w docstringu, i to jego czyta poniższy `python3 -c`. Podniesienie
        # progu w tamtym pliku wystarcza, bez zmiany tego YAML-a.
        run: |
          set -euo pipefail
          budget="$(python3 -c "import sys; sys.path.insert(0,'tools/tests'); import test_suite_runtime_budget as B; print(B.SUITE_RUNTIME_BUDGET_S)")"
          # SYGNAL MIERZALNOSCI (6.D42), na razie WYPISYWANY, nie bramkujacy.
          # `times` z przekierowaniem dziala w TEJ powloce; w `$(...)` daje zera —
          # zmierzone. Roznica dwoch odczytow to czas CPU samego zestawu.
          times > "$RUNNER_TEMP/times-przed.txt"
          start=$(date +%s.%N)
          # 6.D93: zestaw zapisuje czasy per moduł maszynowo, gdy poprosi go o to
          # zmienna. Cel leży w `$RUNNER_TEMP`, czyli POZA workspace'em — plik
          # w drzewie byłby oknem, w którym równoległa kontrola czystości widzi
          # zmianę, której nikt nie popełnił (6.D90).
          METRO_TIMING_OUT="$RUNNER_TEMP/czas-modulow.json" python3 tools/tests/test_all.py
          end=$(date +%s.%N)
          times > "$RUNNER_TEMP/times-po.txt"
          elapsed=$(python3 -c "print(f'{$end - $start:.3f}')")
          cpu=$(python3 -c "import sys; sys.path.insert(0,'tools/tests'); import test_suite_runtime_budget as B; print(f\"{B.cpu_dzieci(sys.argv[1]) - B.cpu_dzieci(sys.argv[2]):.3f}\")" "$RUNNER_TEMP/times-po.txt" "$RUNNER_TEMP/times-przed.txt")
          echo "czas sciany test_all.py: ${elapsed} s (prog ${budget} s)"
          echo "czas CPU zestawu: ${cpu} s"
          # WERDYKT LICZY MODUL, NIE TEN YAML (6.D42). Przebieg, w ktorym maszyna nie
          # oddawala CPU, NIE JEST porownywany z progiem — zamiast tego mowi o tym
          # wprost. Ta sama konstrukcja, co w `tools/ci/assert_linecore_budget.py`.
          # 6.D93: artefakt POWSTAJE PRZED werdyktem, bo przebieg przekraczajacy prog
          # jest dokladnie tym, ktorego czasy chce sie potem obejrzec. Odwrotna
          # kolejnosc dawalaby zapis wylacznie z przebiegow, ktore i tak byly dobre.
          python3 tools/ci/timing_record.py \
            --in "$RUNNER_TEMP/czas-modulow.json" \
            --out "$RUNNER_TEMP/czas-zestawu.json" \
            --wall "$elapsed" --cpu "$cpu"
          # WERDYKT LICZY MODUL, NIE TEN YAML (6.D42). Przebieg, w ktorym maszyna nie
          # oddawala CPU, NIE JEST porownywany z progiem — zamiast tego mowi o tym
          # wprost. Ta sama konstrukcja, co w `tools/ci/assert_linecore_budget.py`.
          python3 -c "import sys; sys.path.insert(0,'tools/tests'); import test_suite_runtime_budget as B; odrzuc, komunikat = B.werdykt(float(sys.argv[1]), float(sys.argv[2])); print(komunikat); sys.exit(1 if odrzuc else 0)" "$elapsed" "$cpu" || {
            echo "::error::zestaw test_all.py przekroczyl prog czasu sciany: ${elapsed} s > ${budget} s"
            exit 1
          }

      - name: Zapis czasu przebiegu jako artefakt
        # 6.D93: `if: always()` z tego samego powodu, dla ktorego artefakt powstaje
        # przed werdyktem — przebieg czerwony jest tym, ktorego czasy sa najbardziej
        # potrzebne. Krok nie zmienia kodu wyjscia joba.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: czas-zestawu
          path: ${{ runner.temp }}/czas-zestawu.json
          if-no-files-found: warn
          retention-days: 30

      - name: Validate committed alignments
        shell: bash
        # Każda oś w data/track musi przechodzić walidator z KAŻDĄ linią, która
        # z niej korzysta. Do 10.09.2026 stała tu jedna linia, wzięta z prefiksu
        # nazwy pliku (L2_E -> L2), i komentarz chwalił to jako „kontrola nie wymaga
        # żadnej listy do ręcznego utrzymywania". To była cena, nie zaleta: pakiety
        # A (L1 i L5) oraz E (L2 i L6) obsługują po dwie linie, a nazwa pliku unosi
        # jedną — druga nie była sprawdzana nigdy (6.D91). `--all-lines` bierze je
        # z pakietu, który oś sama deklaruje.
        run: |
          set -euo pipefail
          found=0
          for axis in data/track/*.json; do
            case "$axis" in *.provenance.json) continue;; esac
            id="$(basename "$axis" .json)"
            # `--package` obok `--line` — 6.D69. Opcja istniała, była przyjmowana
            # i nie wpływała na werdykt; teraz sprawdza, że oś deklaruje ten pakiet
            # i że jej deklaracja zgadza się z `build_packages` w lines.json.
            # Wołana w CI, bo opcja niewołana starzeje się tak samo cicho jak pusta.
            python3 tools/track/validate.py "$axis" --all-lines --package "${id##*_}"
            found=$((found + 1))
          done
          echo "zwalidowanych osi: $found"
          test "$found" -ge 6

      - name: Report data freshness
        shell: bash
        # Informacyjnie, bez --strict: przeterminowane okno ważności nie jest błędem
        # samo w sobie, ale ma być widoczne w logu, zanim ktoś nazwie oś aktualną.
        run: python3 tools/track/data_freshness.py
