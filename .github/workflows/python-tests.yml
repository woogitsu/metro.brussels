name: Python tool tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    # Standard CI runs on GitHub-hosted Linux while Actions minutes are available.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Python
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          python3 --version

      - name: Compile Python tools
        shell: bash
        run: python3 -m compileall -q tools

      - name: Run tool tests
        shell: bash
        run: python3 tools/tests/test_all.py

      - name: Report data freshness
        shell: bash
        # Informacyjnie, bez --strict: przeterminowane okno ważności nie jest błędem
        # samo w sobie, ale ma być widoczne w logu, zanim ktoś nazwie oś aktualną.
        run: python3 tools/track/data_freshness.py
