name: Python tool tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Compile Python tools
        run: python -m compileall -q tools

      - name: Run tool tests
        run: python tools/tests/test_all.py
