name: Visual regression

on:
  pull_request:
    paths:
      - '.github/workflows/visual-regression.yml'
      - 'tools/visual/**'
      - 'tools/ci/visual_smoke.sh'
      - 'tools/blender/**'
      - 'tools/track/**'
      - 'tools/tests/**'
      - 'docs/17-visual-regression.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Blender
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          bash tools/ci/apt_install.sh blender python3-numpy libegl1 libgl1-mesa-dri
          blender --version | head -n 3
          blender --background --python-expr 'import numpy; print("numpy", numpy.__version__)'
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1' || true

      - name: Run visual regression pipeline
        shell: bash
        run: bash tools/ci/visual_smoke.sh

      - name: Upload T-012 verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t-012-visual-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/t012visual/report.txt
            build/t012visual/*.json
            build/t012visual/*.md
            build/t012visual/*.log
            build/t012visual/renders/**
            build/t012visual/diff-determinism/**
            build/t012visual/diff-regression/**
