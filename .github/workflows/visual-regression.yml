name: Visual regression

on:
  pull_request:
    paths:
      - '.github/workflows/visual-regression.yml'
      - 'tools/visual/**'
      # Cały tools/ci, nie pojedynczy skrypt: te joby uruchamiają też
      # apt_install.sh, listy pakietów i (w tunnel-alignment) vehicle_clearance.sh.
      # Przy wąskim wzorcu zmiana takiego pliku nie odpalała własnego CI.
      - 'tools/ci/**'
      - 'tools/blender/**'
      - 'tools/track/**'
      - 'tools/tests/**'
      - 'docs/17-visual-regression.md'
      # Katalog akcji lokalnych, z tego samego powodu co `tools/ci/**` wyżej —
      # 6.D78. Ten job wykonuje treść `.github/actions/*/action.yml` tak samo, jak
      # wykonuje skrypty z `tools/ci/`, a bez tego wzorca zmiana akcji nie odpalała
      # ani jednego joba, który jej używa. Zmierzone 09.09.2026: siedem workflowów
      # z filtrem, siedem luk. Sonda narzędzi nie miała ANI JEDNEGO konsumenta bez
      # filtra, więc jej zmiana nie była przed scaleniem wykonywana wcale.
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression:
    # Ten job chodzi na MASZYNIE WŁAŚCICIELA, nie na jednorazowej maszynie GitHuba.
    # Kroki wykonują kod ze sprawdzonego refa — `tools/**`, `doctor.sh`, skrypty CI —
    # więc bez tego warunku wystarczyłby pull request z forka, żeby uruchomić tam
    # dowolny kod. `metro.brussels` jest prywatne, ale ma WŁĄCZONE forkowanie
    # (`allow_forking: true`), więc uzasadnienie „forka nie da się zrobić" tu nie
    # obowiązuje. Warunek nosi KAŻDY job; `needs:` nie jest zamiennikiem, bo job
    # dopisany bez łańcucha zależności nie miałby żadnej ochrony.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 45

    # Los wysyłki artefaktów wychodzi z joba, bo drugi sygnał w liście checków musi
    # go skądś wziąć. Wyjście jest ustawiane krokiem `if: always()`, nie wyrażeniem
    # `steps.upload.outcome` wprost: wyrażenie w `outputs:` liczy się na końcu joba
    # i przy jobie przegranym łatwo o pustą wartość, a pusta wartość jest w tym
    # rozróżnieniu nieodróżnialna od „wysyłka się udała".
    outputs:
      upload: ${{ steps.los_wysylki.outputs.wynik }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Kontrola czystego workspace: JEDNA implementacja w
      # `.github/actions/check-workspace`, nie kopia w każdym workflow. Powód
      # i mechanika są w samej akcji.
      - name: Workspace jest czysty po checkoucie
        uses: ./.github/actions/check-workspace

      # Sonda narzędzi: JEDNA implementacja w `.github/actions/probe-tools`.
      # Wyjście `libs` ma tę samą umowę co przed wydzieleniem, więc warunki
      # `if: steps.tools.outputs.libs == 'missing'` niżej zostają bez zmian.
      - name: Czy biblioteki systemowe renderu już są
        id: tools
        uses: ./.github/actions/probe-tools
        with:
          libraries: libEGL.so.1 libGL.so.1 libX11.so.6 libXext.so.6 libXrender.so.1 libXfixes.so.3 libXi.so.6 libxkbcommon.so.0 libICE.so.6 libSM.so.6
          commands: curl

      - name: Cache pakietów apt
        if: steps.tools.outputs.libs == 'missing'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/metro-apt
          key: apt-${{ runner.os }}-blender-${{ hashFiles('tools/ci/apt-packages/blender.txt') }}
          restore-keys: apt-${{ runner.os }}-blender-

      - name: Install render libraries
        if: steps.tools.outputs.libs == 'missing'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export APT_CACHE_DIR="$HOME/.cache/metro-apt"
          bash tools/ci/apt_install.sh --set blender
          # Bramka, nie ozdoba: pod `pipefail` brak biblioteki kończy krok błędem.
          # Poprzednia wersja miała tu `|| true`, czyli wypisywała i przemilczała.
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1'

      # Blender w PRZYPIĘTEJ wersji, z oficjalnego tarballa, POZA workspace.
      #
      # Bez `if:`, i to jest celowe. Skrypt jest własną sondą: czyta numer z
      # `tools/ci/blender-version.txt`, porównuje go z tym, co faktycznie stoi w jego
      # katalogu, i pobiera tylko przy rozjeździe. Gdy wersja się zgadza, kończy w 0,12 s.
      # Bramkowanie tego `if:` z workflow oznaczałoby drugą, słabszą sondę obok mocnej.
      #
      # Katalog jest poza workspace, bo `actions/checkout` robi `git clean -ffdx`,
      # a `-x` obejmuje pliki ignorowane — Blender w workspace schodziłby z sieci
      # (366 MB) raz na przebieg. Ta sama decyzja i ten sam katalog co przy Godocie.
      - name: Blender w przypiętej wersji
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bin="$(bash tools/ci/blender_install.sh)"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version | sed -n '1,2p'
          "$bin" --background --python-expr 'import numpy; print("numpy", numpy.__version__)'

      - name: Run visual regression pipeline
        shell: bash
        run: bash tools/ci/visual_smoke.sh

      # 6.D63: krok dostaje `id`, żeby jego LOS dał się wynieść z joba. Do 09.09.2026
      # job czerwieniał tak samo od bramki regresji, jak od odmowy usługi artefaktów
      # (zmierzone na #415: `403 Forbidden` przy `FinalizeArtifact`, artefakt 716 055 B,
      # a `blender-smoke` sześć minut później wgrał 1 905 203 B — więc ani limit, ani
      # kwota; jedno ponowienie dało zielono bez zmiany w kodzie). Z listy checków
      # nie dało się tych dwóch zdarzeń odróżnić.
      - name: Upload T-012 verification artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t-012-visual-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/t012visual/report.txt
            build/t012visual/*.json
            build/t012visual/*.md
            build/t012visual/*.log
            build/t012visual/renders/**
            build/t012visual/diff-determinism/**
            build/t012visual/diff-regression/**

      # `if: always()`, bo gdy wysyłka padnie, kroki bez tego warunku już nie ruszą —
      # a to jest DOKŁADNIE ten przypadek, o którym ten krok ma powiedzieć.
      # `steps.upload.outcome` niesie `failure` także wtedy, gdy job jest już przegrany.
      - name: Zapisz los wysyłki artefaktów
        id: los_wysylki
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "wynik=${{ steps.upload.outcome }}" >> "$GITHUB_OUTPUT"
          echo "wysyłka artefaktów: ${{ steps.upload.outcome }}"

  # DRUGI SYGNAŁ W LIŚCIE CHECKÓW (6.D63). Ten job jest czerwony WYŁĄCZNIE wtedy, gdy
  # padła wysyłka artefaktów — więc para checków rozróżnia dwa zdarzenia bez czytania
  # logu: „visual-regression czerwony, artefakty zielone" znaczy, że bramka znalazła
  # różnicę, a „oba czerwone" — że odmówiła usługa artefaktów.
  #
  # `continue-on-error` na kroku wysyłki jest ODRZUCONE i to jest wybór, nie
  # przeoczenie: schowałoby prawdziwą awarię wysyłki, czyli osłabiło bramkę zamiast
  # ją wyostrzyć. Tutaj job bramki nadal czerwienieje od obu zdarzeń — dochodzi
  # drugi sygnał, nie ubywa pierwszego.
  visual-artifacts:
    needs: visual-regression
    # `always() &&` jest tu WARUNKIEM ISTNIENIA tego joba: bez niego `needs:` zamienia
    # awarię poprzednika w POMINIĘCIE, a job pominięty nie jest sygnałem o niczym.
    # Otoczka niczego nie zdejmuje ze strażnika fork-PR — alternatywa dwóch członów
    # zostaje w całości, i tego pilnuje `test_every_job_refuses_pull_requests_from_forks`.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Los wysyłki artefaktów jest osobnym sygnałem
        shell: bash
        run: |
          set -euo pipefail
          wynik="${{ needs.visual-regression.outputs.upload }}"
          echo "wysyłka artefaktów: ${wynik:-BRAK}"
          if [ "$wynik" = "success" ]; then
            echo "artefakty wgrane — czerwień joba bramki, jeśli jest, mówi o REGRESJI"
            exit 0
          fi
          if [ -z "$wynik" ]; then
            echo "::error title=Wysyłka artefaktów::job bramki nie doszedł do zapisu losu wysyłki"
            exit 1
          fi
          echo "::error title=Wysyłka artefaktów::usługa artefaktów odmówiła (stan: $wynik) — to NIE jest znaleziona regresja"
          exit 1
