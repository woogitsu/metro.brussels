name: M7 shell

on:
  pull_request:
    paths:
      - '.github/workflows/m7-shell.yml'
      - 'tools/blender/m7_layout.py'
      - 'tools/blender/m7_shell.py'
      - 'tools/blender/profiles.py'
      # Cały tools/ci, nie pojedynczy skrypt: te joby uruchamiają też
      # apt_install.sh, listy pakietów i (w tunnel-alignment) vehicle_clearance.sh.
      # Przy wąskim wzorcu zmiana takiego pliku nie odpalała własnego CI.
      - 'tools/ci/**'
      - 'tools/visual/**'
      - 'tools/tests/**'
      - 'data/vehicle/m7-spec.json'
      - 'reports/M7-shell.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m7-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache pakietów apt
        uses: actions/cache@v4
        with:
          path: ~/.cache/metro-apt
          key: apt-${{ runner.os }}-blender-${{ hashFiles('tools/ci/apt-packages/blender.txt') }}
          restore-keys: apt-${{ runner.os }}-blender-

      - name: Install Blender
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export APT_CACHE_DIR="$HOME/.cache/metro-apt"
          bash tools/ci/apt_install.sh --set blender
          blender --version | sed -n '1,3p'
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1' || true

      - name: Generate and verify M7 shell
        shell: bash
        run: bash tools/ci/m7_shell_check.sh

      - name: Upload T-220 verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t-220-m7-shell-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/t220/report.txt
            build/t220/*.json
            build/t220/*.md
            build/t220/*.log
            build/t220/renders/**
