name: Godot first run

# T-400, pierwszy etap. Job odpowiada na jedno pytanie: czy przejazd policzony
# w Godocie jest tym samym przejazdem, co policzony samym rdzeniem.
#
# CLAUDE.md §9: runner właściciela. Godot 4.7.2 mono i Blender są doinstalowywane
# tylko wtedy, gdy ich nie ma — na maszynie właściciela zostają między przebiegami.

on:
  pull_request:
    paths:
      - '.github/workflows/godot-first-run.yml'
      - 'src/Game/**'
      - 'src/Sim/**'
      - 'src/Sim.Runner/**'
      - 'data/track/L1_A.json'
      - 'data/vehicle/m7-spec.json'
      - 'tools/blender/**'
      # `tools/track/**`, bo od 04.09.2026 scena wymaga peronów, a ich kilometraże
      # liczy `tools/track/station_layout.py` (razem z `station_components.py`).
      # Bez tego wpisu zmiana długości peronu szłaby do `main` nieuruchomiona przez
      # jedyny job, który ogląda peron w scenie.
      - 'tools/track/**'
      # Cały tools/ci, nie pojedynczy skrypt: te joby uruchamiają też
      # apt_install.sh, listy pakietów i (w tunnel-alignment) vehicle_clearance.sh.
      # Przy wąskim wzorcu zmiana takiego pliku nie odpalała własnego CI.
      - 'tools/ci/**'
      # Ten workflow URUCHAMIA `tests/Game.Tests` (krok „Engine layer unit tests"),
      # więc musi się odpalać, gdy tamte testy się zmieniają. Bez tego wpisu PR
      # dotykający wyłącznie `tests/Game.Tests/**` dostawał `sim` i `tools`, a job,
      # który jako jedyny te testy wykonuje, w ogóle nie startował — czyli zmiana
      # w testach warstwy silnika szła do `main` NIEURUCHOMIONA.
      #
      # Ten sam błąd trafił się już w `blender-smoke.yml` przy wąskim wzorcu na
      # `tools/ci`; komentarz tamże opisuje go tymi samymi słowami.
      - 'tests/Game.Tests/**'
      # Wzorce wejść maszynisty (`tests/data/manual-keys.log` — prowadzenie i cykl
      # drzwi, `tests/data/manual-keys-limit.log` — prędkość dopuszczalna) są WEJŚCIEM
      # bramki trybu ręcznego i jedynymi plikami tego porównania, których nie liczy
      # żadna z porównywanych stron. Bez tego wpisu PR ruszający sam wzorzec nie odpaliłby
      # jedynego joba, który go uruchamia — czyli zmiana wejścia bramki szłaby do
      # `main` NIESPRAWDZONA. Ten sam błąd, co przy `tests/Game.Tests/**` wyżej.
      - 'tests/data/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  first-run:
    # Ten job chodzi na MASZYNIE WŁAŚCICIELA, nie na jednorazowej maszynie GitHuba.
    # Kroki wykonują kod ze sprawdzonego refa — `tools/**`, `doctor.sh`, skrypty CI —
    # więc bez tego warunku wystarczyłby pull request z forka, żeby uruchomić tam
    # dowolny kod. `metro.brussels` jest prywatne, ale ma WŁĄCZONE forkowanie
    # (`allow_forking: true`), więc uzasadnienie „forka nie da się zrobić" tu nie
    # obowiązuje. Warunek nosi KAŻDY job; `needs:` nie jest zamiennikiem, bo job
    # dopisany bez łańcucha zależności nie miałby żadnej ochrony.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Kontrola czystego workspace: JEDNA implementacja w
      # `.github/actions/check-workspace`, nie kopia w każdym workflow. Powód
      # i mechanika są w samej akcji.
      - name: Workspace jest czysty po checkoucie
        uses: ./.github/actions/check-workspace

      # `setup-dotnet` domyślnie instaluje do `/usr/share/dotnet`, a runner
      # właściciela nie ma tam prawa zapisu — cały krok kończył się serią
      # `mkdir: Permission denied` i `cp: cannot create directory
      # '/usr/share/dotnet/sdk/10.0.400/': Permission denied`. Na jednorazowej
      # maszynie GitHuba działało, bo tam runner jest rootem.
      #
      # Katalog idzie więc tam, gdzie już leży Godot: `RUNNER_TOOL_CACHE`, czyli
      # `_tool`, rodzeństwo workspace'u. Załatwia to dwie rzeczy naraz — prawa
      # zapisu ORAZ przetrwanie `git clean -ffdx` z `actions/checkout`.
      #
      # `runner.tool_cache` NIE działa w `env:` na poziomie workflow ani joba
      # (GitHub odrzuca wtedy cały workflow), więc zmienna powstaje w kroku.
      - name: Katalog SDK poza /usr/share i poza workspace
        shell: bash
        run: |
          set -euo pipefail
          cache="${RUNNER_TOOL_CACHE:-$HOME/.cache/metro-tools}"
          dir="$cache/metro-dotnet"
          case "$dir" in
            "$GITHUB_WORKSPACE"/*)
              echo "::error::katalog SDK $dir leży W WORKSPACE — checkout skasuje go przy następnym przebiegu"
              exit 1
              ;;
            /usr/*)
              echo "::error::katalog SDK $dir leży w /usr — runner nie ma tam prawa zapisu"
              exit 1
              ;;
          esac
          mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"
          echo "SDK poleci do $dir"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # Katalog silnika leży POZA workspace, świadomie. `actions/checkout` wykonuje
      # `git clean -ffdx`, a `-x` obejmuje pliki ignorowane — więc silnik trzymany
      # w workspace znikał przy KAŻDYM checkoucie i był pobierany od nowa (70 MB).
      # Na jednorazowej maszynie GitHuba to było nieuniknione; na maszynie
      # właściciela jest to strata, którą wystarczy przenieść katalog.
      #
      # Dlaczego krokiem, a nie wpisem w `env:` na górze pliku. Bo `${{ runner.* }}`
      # TAM NIE DZIAŁA i nie jest to drobiazg składniowy: workflow-level `env` widzi
      # wyłącznie `github`, `secrets`, `inputs`, `vars` (job-level `env` dokłada
      # `needs`, `strategy`, `matrix`). Kontekst `runner` jest dostępny dopiero
      # w kroku. Pierwsza wersja tej zmiany miała `runner.tool_cache` w `env:` na
      # górze i GitHub ODMÓWIŁ URUCHOMIENIA całego workflow: przebieg 73 zakończył
      # się `failure` w tej samej sekundzie, w której powstał, z zerem jobów.
      # Zmiennej `RUNNER_TOOL_CACHE` używamy więc jako zmiennej powłoki — jest
      # domyślną zmienną środowiskową runnera i wskazuje katalog `_tool`, rodzeństwo
      # workspace'u, którego `git clean` nie dotyka. Fallback na `$HOME`, gdyby jakiś
      # runner jej nie ustawił: liczy się to, żeby katalog był POZA workspace.
      # Wersja jest w ścieżce, więc podniesienie GODOT_VERSION daje nowy katalog
      # zamiast mieszać dwa silniki.
      - name: Katalog silnika poza workspace
        shell: bash
        run: |
          set -euo pipefail
          cache="${RUNNER_TOOL_CACHE:-$HOME/.cache/metro-tools}"
          dir="$cache/metro-godot/${GODOT_VERSION}"
          case "$dir" in
            "$GITHUB_WORKSPACE"/*)
              echo "::error::katalog silnika $dir leży W WORKSPACE — checkout skasuje go przy następnym przebiegu"
              exit 1
              ;;
          esac
          echo "GODOT_DIR=$dir" >> "$GITHUB_ENV"
          echo "silnik poza workspace: $dir"

      # Cache'u GitHuba tu nie ma i nie powinno być: silnik leży teraz poza workspace,
      # więc przeżywa checkout i kolejne przebiegi zastają go na miejscu. `actions/cache`
      # dokładałby do tego pobranie archiwum z sieci po to, żeby odtworzyć katalog,
      # który i tak istnieje.
      - name: Czy Godot już jest
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          binary="$GODOT_DIR/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          # Sam plik wykonywalny nie wystarcza — obok musi leżeć katalog GodotSharp,
          # inaczej silnik nie znajdzie assembly .NET i wywraca się dopiero przy starcie
          # sceny, czyli kilkanaście kroków dalej niż powód.
          if [ -x "$binary" ] && [ -d "$GODOT_DIR/GodotSharp" ]; then
            echo "engine=present" >> "$GITHUB_OUTPUT"
            "$binary" --headless --version
          else
            echo "engine=missing" >> "$GITHUB_OUTPUT"
            echo "Godota nie ma w $GODOT_DIR — krok pobierania go ściągnie."
          fi

      - name: Download Godot mono
        if: steps.godot.outputs.engine == 'missing'
        shell: bash
        # Wersja mono jest konieczna: przejazd jest w C# i korzysta z MetroBxl.Sim.
        # Sam plik wykonywalny nie wystarczy — obok musi leżeć katalog GodotSharp,
        # inaczej silnik nie znajdzie assembly .NET i wywraca się przy starcie.
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_DIR"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          curl -fsSL -o /tmp/godot-mono.zip "$url"
          unzip -q /tmp/godot-mono.zip -d /tmp/godot-mono
          mv /tmp/godot-mono/Godot_v${GODOT_VERSION}_mono_linux_x86_64/* "$GODOT_DIR/"
          ls -la "$GODOT_DIR"

      - name: Report tool versions
        shell: bash
        run: |
          set -euo pipefail
          echo "GODOT_BIN=$GODOT_DIR/Godot_v${GODOT_VERSION}_mono_linux.x86_64" >> "$GITHUB_ENV"
          "$GODOT_DIR/Godot_v${GODOT_VERSION}_mono_linux.x86_64" --headless --version
          dotnet --version

      - name: Core stays free of the engine
        shell: bash
        # Rdzeń buduje się bez Godota, więc projekt Godota nie może być w MetroBxl.sln.
        # Gdyby tam trafił, `dotnet build MetroBxl.sln` z sim-tests.yml zaczęłoby
        # ściągać Godot.NET.Sdk i reguła 9 z CLAUDE.md przestałaby cokolwiek znaczyć.
        run: |
          set -euo pipefail
          # Bez tego `test -f` bramka ogłaszałaby sukces po zniknięciu pliku:
          # grep bez celu zwraca 2, a `if grep ...; then` czyta to jak brak trafień.
          test -f MetroBxl.sln || { echo "brak MetroBxl.sln — bramka nie ma czego sprawdzić" >&2; exit 1; }
          # Wzorzec łapie zarówno `MetroBxl.Game`, jak i `MetroBxl.Game.Tests` —
          # projekt testowy warstwy silnika też referuje Godota, więc jego wejście
          # do solucji zepsułoby regułę 9 dokładnie tak samo.
          # Szukana jest ŚCIEŻKA, nie nazwa projektu. Wpisy w .sln mają postać
          #   Project(...) = "Sim.Tests", "tests\\Sim.Tests\\Sim.Tests.csproj", ...
          # więc napis `MetroBxl.Game` pada wyłącznie dla samego projektu gry;
          # `tests\\Game.Tests\\Game.Tests.csproj` nie zawiera go wcale i poprzednia
          # wersja tej bramki przepuściłaby go do solucji.
          if grep -qE 'src[\\/]Game|tests[\\/]Game\.Tests' MetroBxl.sln; then
            echo "projekt Godota albo jego testy trafiły do MetroBxl.sln — rdzeń przestałby się budować bez silnika" >&2
            exit 1
          fi
          echo "MetroBxl.sln: bez projektu Godota i bez jego testów"

      - name: Build core and console runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet build MetroBxl.sln --configuration Release

      - name: Build the Godot project
        shell: bash
        run: dotnet build src/Game/MetroBxl.Game.csproj --configuration Debug

      # Warstwa silnika do 02.09.2026 nie miała ANI JEDNEGO testu jednostkowego:
      # 13 typów weryfikowanych wyłącznie tym workflow. Audyt mutacyjny pokazał,
      # co przez to przechodziło — `TrackOffsetM 2.10→0.0` i `CabEyeHeightM 2.20→0.0`
      # zostawiały wszystkie bramki zielone, bo kontrola zgodności osi porównuje
      # DŁUGOŚĆ osi, a nie odsunięcie toru od niej ani wysokość oka.
      #
      # Testy chodzą TUTAJ, a nie w sim-tests.yml, bo `tests/Game.Tests` referuje
      # projekt Godota. Krok wyżej pilnuje, że ten projekt nie wszedł do MetroBxl.sln;
      # ten krok daje mu pokrycie bez naruszania tamtej reguły.
      - name: Engine layer unit tests
        shell: bash
        run: dotnet test tests/Game.Tests/Game.Tests.csproj --configuration Release

      # Sonda narzędzi: JEDNA implementacja w `.github/actions/probe-tools`.
      # Wyjście `libs` ma tę samą umowę co przed wydzieleniem, więc warunki
      # `if: steps.tools.outputs.libs == 'missing'` niżej zostają bez zmian.
      - name: Czy biblioteki systemowe renderu już są
        id: tools
        uses: ./.github/actions/probe-tools
        with:
          libraries: libEGL.so.1
          commands: xvfb-run

      - name: Cache pakietów apt
        if: steps.tools.outputs.libs == 'missing'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/metro-apt
          key: apt-${{ runner.os }}-blender-xvfb-${{ hashFiles('tools/ci/apt-packages/blender-xvfb.txt') }}
          restore-keys: apt-${{ runner.os }}-blender-xvfb-

      - name: Install render libraries
        if: steps.tools.outputs.libs == 'missing'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export APT_CACHE_DIR="$HOME/.cache/metro-apt"
          bash tools/ci/apt_install.sh --set blender-xvfb
          # Bramka, nie ozdoba: pod `pipefail` brak biblioteki kończy krok błędem.
          # Poprzednia wersja miała tu `|| true`, czyli wypisywała i przemilczała.
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1'

      # Blender w PRZYPIĘTEJ wersji, z oficjalnego tarballa, POZA workspace.
      #
      # Bez `if:`, i to jest celowe. Skrypt jest własną sondą: czyta numer z
      # `tools/ci/blender-version.txt`, porównuje go z tym, co faktycznie stoi w jego
      # katalogu, i pobiera tylko przy rozjeździe. Gdy wersja się zgadza, kończy w 0,12 s.
      # Bramkowanie tego `if:` z workflow oznaczałoby drugą, słabszą sondę obok mocnej.
      #
      # Katalog jest poza workspace, bo `actions/checkout` robi `git clean -ffdx`,
      # a `-x` obejmuje pliki ignorowane — Blender w workspace schodziłby z sieci
      # (366 MB) raz na przebieg. Ta sama decyzja i ten sam katalog co przy Godocie.
      - name: Blender w przypiętej wersji
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bin="$(bash tools/ci/blender_install.sh)"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version | sed -n '1,2p'
          "$bin" --background --python-expr 'import numpy; print("numpy", numpy.__version__)'

      - name: Generate package A geometry
        shell: bash
        # Chunki i skorupa M7 nie są w repozytorium (CLAUDE.md reguła 8). Powstają
        # z generatora tu i teraz — job sprawdza więc także to, że scena wczytuje
        # świeżo wygenerowaną geometrię, a nie kopię sprzed miesięcy.
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --python-exit-code 7 --python tools/blender/tunnel_sweep.py -- \
            --centerline data/track/L1_A.json --profile box_double --name L1_A \
            --out build/t400/L1_A.glb --metrics build/t400/L1_A-metrics.json \
            --chunk-dir build/t400/chunks --chunk-manifest build/t400/chunks/L1_A-chunks.json
          "$BLENDER_BIN" --background --python-exit-code 7 --python tools/blender/m7_shell.py -- \
            --out build/t400/M7_shell.glb --envelope-out build/t400/M7_envelope.glb \
            --report build/t400/M7_shell.json
          # Perony. Dwa kroki, bo taki jest podział T-211: kilometraże i dolna granica
          # odsunięcia krawędzi liczą się czystym Pythonem, a bryły powstają w Blenderze.
          # `--platform-gap-m` NIE ma wartości domyślnej (R-007: szczeliny peron–pudło
          # nie podaje żadne publiczne źródło), więc stoi tu jawnie i ta sama liczba
          # co w `tools/ci/station_details.sh`.
          #
          # Budowane są WYŁĄCZNIE `platform` i `edge`. Reszta zespołu stacji — schody,
          # winda, antresola, korytarz, portal — sięga od 1,03 m do 8,30 m nad główką
          # szyny, a strop profilu `box_double`, którym zamiatany jest tunel pakietu A,
          # stoi na 4,70 m. Te bryły przebijałyby więc strop i kończyły się w nim,
          # bo komora stacyjna (profil `station`, strop 5,30 m) nie jest jeszcze
          # wstawiana w przebieg tunelu. To jest zakres osobnego zadania i do tego
          # czasu scena pokazuje płytę i pas ostrzegawczy, czyli to, co leży w tunelu,
          # który naprawdę ma.
          # `--platform-length-m design` bierze DECYZJĘ WŁAŚCICIELA (95,0 m, T-212)
          # ze `station_components.DESIGN_PLATFORM_LENGTH_M`, zamiast przepisywać tu
          # liczbę po raz drugi. Bez tego słowa generator brał wartość domyślną, czyli
          # dolną granicę z R-007 (94,0 m = długość składu), i scena dostawała perony
          # o metr krótsze niż decyzja. Pilnuje tego
          # `tools/tests/test_platform_length_in_pipeline.py`, mierząc wynik generatora.
          python3 tools/track/station_layout.py --axis data/track/L1_A.json \
            --out build/t400/L1_A-platforms.json --platform-length-m design
          "$BLENDER_BIN" --background --python-exit-code 7 --python tools/blender/station_kit.py -- \
            --axis data/track/L1_A.json --layout build/t400/L1_A-platforms.json \
            --platform-gap-m 0.08 --component platform --component edge \
            --out build/t400/L1_A-platforms.glb \
            --metrics build/t400/L1_A-platforms-metrics.json
          ls -la build/t400 build/t400/chunks | sed -n '1,20p'

      - name: Axis in C# matches the sweep manifest
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            axis --axis data/track/L1_A.json --manifest build/t400/chunks/L1_A-chunks.json

      - name: Controller is still the T-310 core
        shell: bash
        run: dotnet run --project src/Sim.Runner -c Release --no-build -- parity

      - name: Reference run from the core alone
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/Sim.Runner -c Release --no-build -- drive --out build/t400/core.csv
          wc -l build/t400/core.csv

      - name: Godot run, 120 steps per frame
        shell: bash
        # BRAMKA OSTRZEŻEŃ — obowiązuje KAŻDE uruchomienie sceny w tym pliku i dlatego
        # jest wyjaśniona raz, tutaj. Do 04.09.2026 żaden krok nie patrzył, czy silnik
        # czegoś nie wypisał: przebieg `--line` kończył się kodem 0, telemetria zgadzała
        # się z rdzeniem co do bitu, a w logu stało DZIESIĘĆ ostrzeżeń `Target and up
        # vectors are colinear` z `FirstRun.PlaceEverything`. `CLAUDE.md` §5 wymienia
        # tę rodzinę wprost: „skrypt wykonał się bez błędu" nie jest weryfikacją.
        #
        # `2>&1` jest tu warunkiem sensu, nie ozdobą: Godot pisze ostrzeżenia na
        # stderr, więc `| tee` bez przekierowania zapisywał log BEZ ani jednego z nich.
        # Listę dopuszczonych (szum maszyny bez karty graficznej i bez dźwiękowej)
        # trzyma `tools/ci/assert_no_godot_warnings.py` — jawną, krótką i z powodem
        # przy każdej pozycji.
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path src/Game -- \
            --telemetry="$PWD/build/t400/godot.csv" --steps-per-frame=120 \
            2>&1 | tee build/t400/godot-telemetry.log
          python3 tools/ci/assert_no_godot_warnings.py build/t400/godot-telemetry.log
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            compare build/t400/core.csv build/t400/godot.csv --tolerance 0

      - name: Godot run, uneven frames
        shell: bash
        # Ten sam przejazd przy innym, celowo nierównym rytmie klatek. Jeżeli krok
        # stały działa, telemetria musi wyjść identyczna — nie „podobna".
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path src/Game -- \
            --telemetry="$PWD/build/t400/godot_jitter.csv" --steps-per-frame=37 --jitter=0.45 \
            2>&1 | tee build/t400/godot-jitter.log
          python3 tools/ci/assert_no_godot_warnings.py build/t400/godot-jitter.log
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            compare build/t400/core.csv build/t400/godot_jitter.csv --tolerance 0

      - name: Manual run — the replayed input log must be the core's own drive
        shell: bash
        # BRAMKA TRYBU RĘCZNEGO (G-2). Do 05.09.2026 nie było jej w ogóle: żaden krok
        # tego workflow nie uruchamiał sceny bez `--line`, `--shot` i `--telemetry`
        # sterowanego scenariuszem, więc gałąź `DriverInput → DriverNotch →
        # StationService → TrainController` nie miała ANI JEDNEJ bramki. Powód był
        # mechaniczny, a nie z niedopatrzenia: tryb ręczny nie kończył się nigdy
        # (`timeout 60` → kod 124), więc nie dało się go postawić w CI. Zapis wejść
        # z G-1 daje mu koniec — pole `kroki=` w nagłówku — i dopiero to otwiera ten krok.
        #
        # PORÓWNANIE IDZIE Z RDZENIEM, nie sceny ze sceną. `Sim.Runner replay` liczy
        # ten sam zapis wejść bez silnika, tą samą drogą przez rdzeń. Bez tej strony
        # bramka pytałaby wyłącznie „czy Godot zgadza się z Godotem".
        #
        # ZAPIS WEJŚĆ JEST W REPOZYTORIUM (`tests/data/manual-keys.log`), a nie
        # generowany tu przez scenę. Zapis nagrany w locie wychodziłby z tego samego
        # przebiegu, który potem sprawdza, więc obie strony zgadzałyby się także wtedy,
        # gdyby nagrywanie było zepsute. Plik pokrywa rozruch, zatrzymanie na Beekkant
        # w oknie ±5,000 m, PEŁNY cykl drzwi, wybieg i hamowanie do postoju.
        #
        # CZEGO TEN WZORZEC NIE POKRYWA — i to jest sprostowanie, nie przypis. Do
        # 05.09.2026 stało tu, że plik „pokrywa" przejazd ręczny. Nie pokrywał
        # PRĘDKOŚCI DOPUSZCZALNEJ: jego szczyt to 65,22 km/h przy limicie 72,00 km/h,
        # więc wychodzi CO DO BAJTU tak samo przy 72 i przy 80 km/h. Między #246
        # (scena wzięła 72 km/h z planu) a #248 (rdzeń wziął to samo) obie strony
        # jechały RÓŻNYM limitem, a ten krok był zielony przez cały ten czas. Limit
        # sprawdza osobny wzorzec i osobny krok niżej.
        #
        # LICZBY BEZ ŹRÓDŁA STOJĄ TU JAWNIE, po obu stronach porównania. Tempo
        # nastawnika, wymiana pasażerów i okno zatrzymania mieszkają w
        # `Game.DesignAssumptions`, czyli po stronie silnika, a `src/Sim` nie ma prawa
        # tego pliku zobaczyć (CLAUDE.md §4.9). Kopia stałej w `Sim.Runner` byłaby drugą
        # prawdą rozjeżdżającą się po cichu, więc wartości podaje CI — ta sama decyzja
        # i ten sam zapis, co `--limit-kmh 70 --exchange-s 8 --stop-window-m 5`
        # w kroku `line` niżej.
        #
        # DWA RYTMY KLATEK, i to jest właściwość, którą wywalczyło G-1: położenie
        # nastawnika zależy od liczby KROKÓW, przez które klawisz był trzymany, a nie
        # od tego, jak kroki rozłożyły się na klatki. Przed G-1 ta sama sekwencja dawała
        # 566,407 m przy 120 kl./s i 566,641 m przy 60 kl./s, przy bramkach z progiem 0.
        #
        # DLACZEGO AKURAT 120 i 7 kroków na klatkę:
        #   * 8880 = 2⁴·3·5·37, a 7 jest z tą liczbą względnie pierwsze — 8880 = 1268·7 + 4,
        #     więc OSTATNIA klatka jest niepełna i akumulator musi przenieść resztę oraz
        #     przerwać w środku klatki. Przy 37 (dzielnik 8880) tego przypadku by nie było.
        #   * 1269 klatek wobec 74 to siedemnastokrotnie inny podział tych samych kroków.
        #   * `--steps-per-frame=1` NIE jest tu użyte świadomie: pętla klatek headless
        #     Godota jest ograniczona zegarem, nie procesorem (zmierzone ~135 kl./s), więc
        #     8880 klatek to ~62 s czekania — i nie wnosi ani jednego bitu, bo przebieg
        #     przy 1 kroku na klatkę wychodzi z tą samą sumą md5 co przy 7 i przy 120.
        run: |
          set -euo pipefail
          mkdir -p build/t400/reczny
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            replay --keys tests/data/manual-keys.log --axis data/track/L1_A.json \
            --signalling data/design/signalling/classic-2026.json \
            --notch-rate 0.80 --exchange-s 8 --stop-window-m 5 \
            --out build/t400/reczny/core.csv 2>&1 | tee build/t400/reczny/core.log
          # Rdzeń ma OBSŁUŻYĆ stację, a nie ją przejechać. Bez tego warunku zapis
          # przesunięty o kilkadziesiąt metrów dałby przejazd bez zatrzymania — obie
          # strony policzyłyby go tak samo dobrze i bramka nadal byłaby zielona,
          # tyle że cykl drzwi nie wykonałby się ani razu.
          grep -q "stacji obsłużonych=1 przejechanych=0" build/t400/reczny/core.log \
            || { echo "BŁĄD: wzorzec wejść nie zatrzymuje składu na stacji" >&2
                 cat build/t400/reczny/core.log >&2; exit 1; }
          for spf in 120 7; do
            "$GODOT_BIN" --headless --path src/Game -- \
              --replay="$PWD/tests/data/manual-keys.log" \
              --telemetry="$PWD/build/t400/reczny/scene-spf$spf.csv" \
              --steps-per-frame="$spf" \
              2>&1 | tee "build/t400/reczny/scene-spf$spf.log"
            python3 tools/ci/assert_no_godot_warnings.py "build/t400/reczny/scene-spf$spf.log"
            # Przebieg ma się skończyć SAM, na ostatnim kroku zapisu, i ma być
            # prowadzony poleceniem maszynisty — nie scenariuszem i nie autopilotem.
            # Kod wyjścia 0 tego nie odróżnia: scena, która przerwałaby po pierwszej
            # klatce, też wychodzi zerem.
            grep -q "^\[ODTWORZENIE\] koniec: kroków=8880 " "build/t400/reczny/scene-spf$spf.log" \
              || { echo "BŁĄD: odtworzenie przy $spf krokach na klatkę nie doszło do końca zapisu" >&2
                   grep "^\[ODTWORZENIE\]" "build/t400/reczny/scene-spf$spf.log" >&2; exit 1; }
            grep -q "^\[PRZEJAZD\] tryb=replay " "build/t400/reczny/scene-spf$spf.log" \
              || { echo "BŁĄD: scena nie jest w trybie odtworzenia" >&2
                   grep "^\[PRZEJAZD\]" "build/t400/reczny/scene-spf$spf.log" >&2; exit 1; }
            dotnet run --project src/Sim.Runner -c Release --no-build -- \
              compare build/t400/reczny/core.csv "build/t400/reczny/scene-spf$spf.csv" \
              --tolerance 0
          done
          # Oba rytmy klatek wobec SIEBIE. Zgodność każdego z rdzeniem już to implikuje,
          # ale ta linijka nazywa właściwość, o którą chodzi, więc jej zniknięcie
          # z workflow będzie widoczne.
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            compare build/t400/reczny/scene-spf120.csv build/t400/reczny/scene-spf7.csv \
            --tolerance 0
          # ŚLAD CYKLU DRZWI W SAMEJ TELEMETRII. Maszynista trzyma W od 45,0 s, więc
          # nastawnik dobija do 1,0 — a `throttle` w telemetrii zostaje ZERO do 57,975 s,
          # bo `StationService` trzyma blokadę trakcji. Jedenaście próbek stoi przy tym
          # z hamulcem zwolnionym do zera: skład nie jedzie, choć nic go nie trzyma poza
          # drzwiami. Samo porównanie z rdzeniem tego nie nazwie — obie strony mogłyby
          # zgodnie nie mieć cyklu drzwi w ogóle.
          python3 - <<'DRZWI'
          import csv

          with open("build/t400/reczny/core.csv", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          # `step > 0` odsiewa wiersz zerowy, czyli stan PRZED pierwszym krokiem:
          # skład stoi tam z zerowym nastawnikiem i zerowym hamulcem, bo jeszcze nic
          # nie zrobił, a nie dlatego, że trzymają go drzwi.
          held = [r for r in rows
                  if int(r["step"]) > 0
                  and float(r["speed_mps"]) == 0.0
                  and float(r["brake"]) == 0.0
                  and float(r["throttle"]) == 0.0]
          assert len(held) == 11, f"próbek pod blokadą drzwi: {len(held)}, oczekiwano 11"
          print(f"[DRZWI] {len(held)} próbek stoi bez hamulca i bez ciągu — "
                f"od {held[0]['t_s']} s do {held[-1]['t_s']} s")
          DRZWI

      - name: Negative control of the manual comparison
        shell: bash
        # Bramka, która mówi „ok" także wtedy, gdy nic nie sprawdza, jest bezużyteczna
        # (reports/T-310-physics.md §6). Dwie mutacje, dwa różne sposoby oszukania
        # kroku wyżej — obie MUSZĄ zostać odrzucone.
        #
        #  1. TELEMETRIA o milimetr. Próg jest zerowy, więc milimetr wystarcza; to jest
        #     ten sam negatyw, co przy porównaniu `--line`.
        #  2. ZAPIS WEJŚĆ o jeden krok. Ta mutacja odpowiada na pytanie, którego pierwsza
        #     nie zadaje: czy scena naprawdę CZYTA plik wzorca, czy tylko jedzie obok
        #     niego. Gdyby `--replay` ignorowało zawartość zapisu, mutacja przeszłaby
        #     porównanie — bo rdzeń policzyłby wtedy przejazd inny, a scena ten sam.
        run: |
          set -euo pipefail
          python3 - <<'NEGCSV'
          import csv

          rows = list(csv.reader(open("build/t400/reczny/scene-spf120.csv", encoding="utf-8")))
          rows[40][2] = repr(float(rows[40][2]) + 0.001)
          with open("build/t400/reczny/scene-bad.csv", "w", newline="", encoding="utf-8") as h:
              csv.writer(h).writerows(rows)
          NEGCSV
          rc=0
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            compare build/t400/reczny/core.csv build/t400/reczny/scene-bad.csv \
            --tolerance 0 || rc=$?
          test "$rc" -ne 0 \
            || { echo "BŁĄD: różnica 1 mm w telemetrii przeszła porównanie" >&2; exit 1; }
          echo "[NEGATYW] różnica 1 mm w jednym wierszu telemetrii odrzucona, tak jak ma być"

          sed 's/^2800;S$/2801;S/' tests/data/manual-keys.log \
            > build/t400/reczny/manual-keys-bad.log
          cmp -s tests/data/manual-keys.log build/t400/reczny/manual-keys-bad.log \
            && { echo "BŁĄD: mutacja zapisu wejść niczego nie zmieniła" >&2; exit 1; }
          "$GODOT_BIN" --headless --path src/Game -- \
            --replay="$PWD/build/t400/reczny/manual-keys-bad.log" \
            --telemetry="$PWD/build/t400/reczny/scene-keys-bad.csv" \
            --steps-per-frame=120 \
            2>&1 | tee build/t400/reczny/scene-keys-bad.log
          python3 tools/ci/assert_no_godot_warnings.py build/t400/reczny/scene-keys-bad.log
          rc=0
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            compare build/t400/reczny/core.csv build/t400/reczny/scene-keys-bad.csv \
            --tolerance 0 || rc=$?
          test "$rc" -ne 0 \
            || { echo "BŁĄD: przesunięcie hamowania o jeden krok przeszło porównanie — scena nie czyta zapisu" >&2
                 exit 1; }
          echo "[NEGATYW] hamowanie przesunięte o jeden krok odrzucone, tak jak ma być"

      - name: Manual mode — both sides must hold the same speed ceiling
        shell: bash
        # DLACZEGO OSOBNY KROK, SKORO PORÓWNANIE WYŻEJ JUŻ JEST. Bo tamto porównanie
        # nie umie zobaczyć limitu. Telemetria nie ma kolumny z prędkością
        # dopuszczalną: limit widać w niej wyłącznie wtedy, gdy przejazd o niego
        # ZAHACZY. Wzorzec `manual-keys.log` dochodzi do 65,22 km/h, więc wychodzi
        # co do bajtu tak samo przy 72 i przy 80 km/h — zmierzone, negatyw niżej.
        #
        # I to nie jest hipotetyczne. #246 przestawiło scenę na 72,00 km/h z planu
        # `data/design/signalling/classic-2026.json`, a `Sim.Runner replay` został
        # wtedy pominięty i dalej brał 80 km/h z `DriveScenario` — czyli prędkość
        # KONSTRUKCYJNĄ M7, nie ograniczenie na torze. Obie strony bramki jechały
        # różnym limitem, a bramka była zielona. Ten krok jest po to, żeby drugi raz
        # nie była.
        #
        # WZORZEC `manual-keys-limit.log` to jeden wpis: pełny ciąg przez 7200 kroków.
        # Limit osiąga w kroku 3420 (28,500 s) i trzyma go do końca, więc różnica
        # w suficie prędkości przekłada się wprost na drogę: 1056,464 m przy 72 km/h
        # wobec 1120,969 m przy 80 km/h.
        run: |
          set -euo pipefail
          mkdir -p build/t400/limit
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            replay --keys tests/data/manual-keys-limit.log --axis data/track/L1_A.json \
            --signalling data/design/signalling/classic-2026.json \
            --notch-rate 0.80 --exchange-s 8 --stop-window-m 5 \
            --out build/t400/limit/core.csv 2>&1 | tee build/t400/limit/core.log
          # Przejazd ma NAPRAWDĘ dobić do sufitu. Bez tego warunku wzorzec skrócony
          # albo osłabiony przestałby sprawdzać limit, a porównanie niżej nadal
          # wychodziłoby zielone — dokładnie ta usterka, którą ten krok zamyka.
          python3 - <<'SUFIT'
          import csv

          with open("build/t400/limit/core.csv", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          top = max(float(r["speed_kmh"]) for r in rows)
          at_ceiling = [r for r in rows if abs(float(r["speed_kmh"]) - 72.0) < 1e-9]
          assert abs(top - 72.0) < 1e-9, f"szczyt przejazdu {top} km/h, oczekiwano 72,0"
          assert len(at_ceiling) >= 25, (
              f"próbek na suficie: {len(at_ceiling)}, za mało żeby limit cokolwiek związał")
          print(f"[SUFIT] szczyt {top} km/h, {len(at_ceiling)} próbek na suficie "
                f"od {at_ceiling[0]['t_s']} s")
          SUFIT
          # Obie strony mają WYPOWIEDZIEĆ tę samą liczbę i ten sam plan. Sama zgodność
          # telemetrii tego nie mówi: dwie strony mogą trafić w ten sam przejazd,
          # czytając limit z dwóch różnych miejsc, dopóki liczby są równe.
          grep -o "^\[LIMIT\] tryb ręczny: [0-9.]* km/h z planu [^ ]*" \
            build/t400/limit/core.log > build/t400/limit/core-limit.txt
          test -s build/t400/limit/core-limit.txt \
            || { echo "BŁĄD: rdzeń nie wypisał wiersza [LIMIT]" >&2; exit 1; }
          for spf in 120 7; do
            "$GODOT_BIN" --headless --path src/Game -- \
              --replay="$PWD/tests/data/manual-keys-limit.log" \
              --telemetry="$PWD/build/t400/limit/scene-spf$spf.csv" \
              --steps-per-frame="$spf" \
              2>&1 | tee "build/t400/limit/scene-spf$spf.log"
            python3 tools/ci/assert_no_godot_warnings.py "build/t400/limit/scene-spf$spf.log"
            grep -q "^\[ODTWORZENIE\] koniec: kroków=7200 " "build/t400/limit/scene-spf$spf.log" \
              || { echo "BŁĄD: odtworzenie przy $spf krokach na klatkę nie doszło do końca zapisu" >&2
                   grep "^\[ODTWORZENIE\]" "build/t400/limit/scene-spf$spf.log" >&2; exit 1; }
            grep -o "^\[LIMIT\] tryb ręczny: [0-9.]* km/h z planu [^ ]*" \
              "build/t400/limit/scene-spf$spf.log" > "build/t400/limit/scene-limit-spf$spf.txt"
            diff -u build/t400/limit/core-limit.txt "build/t400/limit/scene-limit-spf$spf.txt" \
              || { echo "BŁĄD: rdzeń i scena nazywają inny limit albo inny plan" >&2; exit 1; }
            dotnet run --project src/Sim.Runner -c Release --no-build -- \
              compare build/t400/limit/core.csv "build/t400/limit/scene-spf$spf.csv" \
              --tolerance 0
          done

      - name: Negative control of the speed-ceiling gate
        shell: bash
        # Dwie mutacje, dwa różne zdania do udowodnienia.
        #
        #  1. PLAN o osiem km/h. Rdzeń dostaje plan z 80 km/h zamiast 72; scena nadal
        #     czyta `RunPlan.ManualSpeedLimitPlanPath`. Porównanie MUSI paść — to jest
        #     dokładnie stan sprzed tej zmiany, odtworzony.
        #  2. TEN SAM PLAN NA STARYM WZORCU. Porównanie MUSI PRZEJŚĆ, i to jest sedno:
        #     pokazuje, że stary wzorzec tej różnicy nie widzi, czyli że nowy nie jest
        #     dubletem. Bez tej połowy nikt nie wie, po co w repozytorium leży drugi
        #     plik wejść.
        run: |
          set -euo pipefail
          python3 - <<'PLAN80'
          import json

          with open("data/design/signalling/classic-2026.json", encoding="utf-8") as handle:
              plan = json.load(handle)
          assert plan["default_permitted_speed_kmh"]["value"] == 72, "plan nie ma dziś 72 km/h"
          plan["default_permitted_speed_kmh"]["value"] = 80
          with open("build/t400/limit/plan-80.json", "w", encoding="utf-8") as handle:
              json.dump(plan, handle, ensure_ascii=False, indent=2)
          PLAN80
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            replay --keys tests/data/manual-keys-limit.log --axis data/track/L1_A.json \
            --signalling build/t400/limit/plan-80.json \
            --notch-rate 0.80 --exchange-s 8 --stop-window-m 5 \
            --out build/t400/limit/core-80.csv 2>&1 | tee build/t400/limit/core-80.log
          rc=0
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            compare build/t400/limit/core-80.csv build/t400/limit/scene-spf120.csv \
            --tolerance 0 || rc=$?
          test "$rc" -ne 0 \
            || { echo "BŁĄD: limit podniesiony o 8 km/h przeszedł porównanie" >&2; exit 1; }
          echo "[NEGATYW] limit 80 km/h wobec 72 km/h w scenie odrzucony, tak jak ma być"

          # Stary wzorzec przy OBU limitach, policzony tu od zera. Sięgnięcie po
          # `build/t400/reczny/core.csv` z kroku wyżej byłoby tańsze, ale wtedy brak
          # tamtego pliku wyglądałby jak „stary wzorzec widzi zmianę" — czyli komunikat
          # mówiłby coś innego, niż się stało.
          #
          # Oba wywołania są rozpisane, bo pętla po zmiennej `--signalling "$plan"`
          # ukrywa ścieżkę przed `test_every_replayed_manual_run_reads_the_limit_from…`,
          # a wtedy bramka pilnująca, że CI i scena czytają ten sam plan, przestaje
          # widzieć akurat te wywołania. Powtórzenie jest tu tańsze niż furtka.
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            replay --keys tests/data/manual-keys.log --axis data/track/L1_A.json \
            --signalling data/design/signalling/classic-2026.json \
            --notch-rate 0.80 --exchange-s 8 --stop-window-m 5 \
            --out build/t400/limit/stary-72.csv 2>&1 \
            | tee build/t400/limit/stary-72.log
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            replay --keys tests/data/manual-keys.log --axis data/track/L1_A.json \
            --signalling build/t400/limit/plan-80.json \
            --notch-rate 0.80 --exchange-s 8 --stop-window-m 5 \
            --out build/t400/limit/stary-80.csv 2>&1 \
            | tee build/t400/limit/stary-80.log
          cmp build/t400/limit/stary-72.csv build/t400/limit/stary-80.csv \
            || { echo "BŁĄD: stary wzorzec JEDNAK widzi zmianę limitu — wtedy nowy jest dubletem i ten krok trzeba przemyśleć" >&2
                 exit 1; }
          echo "[NEGATYW] stary wzorzec przy 72 i przy 80 km/h daje ten sam plik co do bajtu — dlatego istnieje drugi"

          # Brak planu to ODMOWA, nie cichy odwrót na 80 km/h ze scenariusza.
          rc=0
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            replay --keys tests/data/manual-keys-limit.log --axis data/track/L1_A.json \
            --out build/t400/limit/bez-planu.csv > build/t400/limit/bez-planu.log 2>&1 || rc=$?
          test "$rc" -ne 0 \
            || { echo "BŁĄD: replay bez --signalling policzył przejazd zamiast odmówić" >&2; exit 1; }
          grep -q "replay wymaga --signalling" build/t400/limit/bez-planu.log \
            || { echo "BŁĄD: odmowa nie mówi, czego brakuje" >&2
                 cat build/t400/limit/bez-planu.log >&2; exit 1; }
          echo "[NEGATYW] replay bez planu odmawia, tak jak scena"

      - name: Manual mode — a run with a reset replays to the same bytes
        shell: bash
        # RESET BYŁ JEDYNĄ GAŁĘZIĄ TRYBU RĘCZNEGO BEZ BRAMKI, i nie z lenistwa: do
        # 05.09.2026 `InputLogRecorder` kasował zapis przy resecie, więc przejazdu
        # z resetem nie dało się odtworzyć — a czego nie da się odtworzyć, tego nie da
        # się porównać. Decyzja właściciela (wariant W1) wprowadziła wersję 2 formatu
        # z wpisem `krok;reset`; ten krok jest tym, po co ta wersja powstała.
        #
        # WZORZEC `manual-keys-reset.log` ma dwie połowy po 5400 kroków z TĄ SAMĄ
        # sekwencją klawiszy liczoną od swojego początku, a reset stoi między nimi —
        # w kroku 5400, czyli w 45,000 s, dokładnie w środku cyklu drzwi na Beekkant
        # (postój od 41,475 s do 57,975 s). To jest ta usterka, którą naprawiło G-4.
        #
        # DRUGIE PORÓWNANIE JEST WAŻNIEJSZE OD PIERWSZEGO. Zgodność sceny z rdzeniem
        # mówi tylko, że obie strony liczą tak samo — także wtedy, gdyby obie tak samo
        # ŹLE resetowały. Dopiero porównanie przejazdu PO RESECIE z niezależnym
        # przejazdem BEZ RESETU (`manual-keys.log`, którego pierwsze 5400 kroków ma tę
        # samą sekwencję klawiszy) odpowiada na pytanie, o które tu chodzi: czy przez
        # reset cokolwiek przeżyło — kolejka stacji, licznik cyklu drzwi, dźwignia,
        # reszta czasu klatki.
        run: |
          set -euo pipefail
          mkdir -p build/t400/reset
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            replay --keys tests/data/manual-keys-reset.log --axis data/track/L1_A.json \
            --signalling data/design/signalling/classic-2026.json \
            --notch-rate 0.80 --exchange-s 8 --stop-window-m 5 \
            --out build/t400/reset/core.csv 2>&1 | tee build/t400/reset/core.log
          # Reset ma się NAPRAWDĘ wykonać, i to raz. Bez tego warunku wzorzec
          # z usuniętym wpisem przeszedłby porównania tak samo dobrze, tyle że
          # nie sprawdziłby resetu ani razu.
          grep -q "sesja=10800 kroków resetów=1" build/t400/reset/core.log \
            || { echo "BŁĄD: wzorzec nie wykonał dokładnie jednego resetu" >&2
                 cat build/t400/reset/core.log >&2; exit 1; }
          grep -q "stacji obsłużonych=1 przejechanych=0" build/t400/reset/core.log \
            || { echo "BŁĄD: przejazd po resecie nie obsłużył stacji" >&2
                 cat build/t400/reset/core.log >&2; exit 1; }
          for spf in 120 7; do
            "$GODOT_BIN" --headless --path src/Game -- \
              --replay="$PWD/tests/data/manual-keys-reset.log" \
              --telemetry="$PWD/build/t400/reset/scene-spf$spf.csv" \
              --steps-per-frame="$spf" \
              2>&1 | tee "build/t400/reset/scene-spf$spf.log"
            python3 tools/ci/assert_no_godot_warnings.py "build/t400/reset/scene-spf$spf.log"
            grep -q "sesja=10800 kroków resetów=1" "build/t400/reset/scene-spf$spf.log" \
              || { echo "BŁĄD: scena przy $spf krokach na klatkę nie wykonała resetu z zapisu" >&2
                   grep "^\[ODTWORZENIE\]" "build/t400/reset/scene-spf$spf.log" >&2; exit 1; }
            dotnet run --project src/Sim.Runner -c Release --no-build -- \
              compare build/t400/reset/core.csv "build/t400/reset/scene-spf$spf.csv" \
              --tolerance 0
          done
          # PRZEJAZD PO RESECIE == PRZEJAZD BEZ RESETU, co do bajtu. Telemetria po
          # resecie zaczyna się od nowa (wiersze sprzed niego opisywałyby inny przejazd
          # tymi samymi numerami), więc plik z resetem zawiera wyłącznie drugi przejazd.
          # Ostatni wiersz odpada, bo jest wierszem KOŃCA zapisu, którego przejazd bez
          # resetu w tym miejscu nie ma.
          wspolne=$(( $(wc -l < build/t400/reset/core.csv) - 1 ))
          test "$wspolne" -ge 40 \
            || { echo "BŁĄD: do porównania zostało $wspolne wierszy — za mało, żeby cokolwiek znaczyło" >&2
                 exit 1; }
          head -n "$wspolne" build/t400/reset/core.csv > build/t400/reset/po-resecie.csv
          head -n "$wspolne" build/t400/reczny/core.csv > build/t400/reset/bez-resetu.csv
          cmp build/t400/reset/po-resecie.csv build/t400/reset/bez-resetu.csv \
            || { echo "BŁĄD: przez reset coś przeżyło — przejazd po nim nie jest tym samym przejazdem" >&2
                 diff build/t400/reset/po-resecie.csv build/t400/reset/bez-resetu.csv \
                   > build/t400/reset/rozjazd.txt || true
                 head -20 build/t400/reset/rozjazd.txt >&2
                 exit 1; }
          echo "[RESET] $wspolne wierszy przejazdu po resecie identycznych co do bajtu z przejazdem bez resetu"

      - name: Negative control of the reset gate
        shell: bash
        # Trzy mutacje, trzy różne zdania do udowodnienia.
        #
        #  1. WPIS RESETU USUNIĘTY. Plik mówi wtedy `wersja=2` i nie ma ani jednego
        #     resetu — ODMOWA odczytu. Bez tej kontroli wersja w nagłówku byłaby
        #     napisem, którego nikt nie porównuje z treścią.
        #  2. RESET PRZESUNIĘTY O JEDEN KROK. Odpowiada na pytanie, którego pierwsza
        #     nie zadaje: czy reset naprawdę pada TAM, gdzie stoi w zapisie, czy tylko
        #     gdzieś w pobliżu. Rytm klatek ma go nie ruszać.
        #  3. WERSJA COFNIĘTA NA 1. Plik z resetem w wersji 1 to ODMOWA — w drugą
        #     stronę niż mutacja 1, i dlatego jest osobno.
        run: |
          set -euo pipefail
          grep -v '^5400;reset$' tests/data/manual-keys-reset.log \
            > build/t400/reset/bez-wpisu.log
          cmp -s tests/data/manual-keys-reset.log build/t400/reset/bez-wpisu.log \
            && { echo "BŁĄD: mutacja nie usunęła wpisu resetu" >&2; exit 1; }
          rc=0
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            replay --keys build/t400/reset/bez-wpisu.log --axis data/track/L1_A.json \
            --signalling data/design/signalling/classic-2026.json \
            --out build/t400/reset/bez-wpisu.csv > build/t400/reset/bez-wpisu.txt 2>&1 || rc=$?
          test "$rc" -ne 0 \
            || { echo "BŁĄD: zapis 'wersja=2' bez ani jednego resetu został przyjęty" >&2; exit 1; }
          echo "[NEGATYW] zapis w wersji 2 bez wpisu resetu odrzucony, tak jak ma być"

          sed 's/^5400;reset$/5401;reset/' tests/data/manual-keys-reset.log \
            > build/t400/reset/przesuniety.log
          cmp -s tests/data/manual-keys-reset.log build/t400/reset/przesuniety.log \
            && { echo "BŁĄD: mutacja nie przesunęła resetu" >&2; exit 1; }
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            replay --keys build/t400/reset/przesuniety.log --axis data/track/L1_A.json \
            --signalling data/design/signalling/classic-2026.json \
            --notch-rate 0.80 --exchange-s 8 --stop-window-m 5 \
            --out build/t400/reset/przesuniety.csv 2>&1 | tee build/t400/reset/przesuniety.txt
          rc=0
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            compare build/t400/reset/przesuniety.csv build/t400/reset/scene-spf120.csv \
            --tolerance 0 || rc=$?
          test "$rc" -ne 0 \
            || { echo "BŁĄD: reset przesunięty o jeden krok przeszedł porównanie" >&2; exit 1; }
          echo "[NEGATYW] reset przesunięty o jeden krok odrzucony, tak jak ma być"

          sed 's/^wersja=2$/wersja=1/' tests/data/manual-keys-reset.log \
            > build/t400/reset/wersja-1.log
          cmp -s tests/data/manual-keys-reset.log build/t400/reset/wersja-1.log \
            && { echo "BŁĄD: mutacja nie cofnęła wersji" >&2; exit 1; }
          rc=0
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            replay --keys build/t400/reset/wersja-1.log --axis data/track/L1_A.json \
            --signalling data/design/signalling/classic-2026.json \
            --out build/t400/reset/wersja-1.csv > build/t400/reset/wersja-1.txt 2>&1 || rc=$?
          test "$rc" -ne 0 \
            || { echo "BŁĄD: zapis 'wersja=1' z wpisem resetu został przyjęty" >&2; exit 1; }
          echo "[NEGATYW] zapis w wersji 1 z wpisem resetu odrzucony, tak jak ma być"

      - name: Line run — scene must call the same stations as the core
        shell: bash
        # Przejazd całą linią z zatrzymaniami, prowadzony rdzeniem (`LineDrive`), liczony
        # DWA RAZY: raz przez `Sim.Runner`, raz przez scenę Godota. Porównanie idzie po
        # ZATRZYMANIACH, nie po tym, że oba przebiegi się nie wywróciły — bo dwa przebiegi
        # kończące się kodem 0 mogą różnić się liczbą obsłużonych stacji, a tego nie widać
        # z kodu wyjścia.
        #
        # `--limit-kmh` jest podane JAWNIE po obu stronach i to jest warunek sensu tego
        # porównania: prędkość dopuszczalna na torze nie ma źródła (R-006), a domyślna
        # z `DriveScenario` to 80 km/h, czyli prędkość KONSTRUKCYJNA M7. Zmierzone
        # 04.09.2026: bez tego argumentu scena jechała 80 km/h i przejeżdżała linię
        # w 724,94 s wobec 733,14 s rdzenia.
        run: |
          set -euo pipefail
          mkdir -p build/t400/linia
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            line --axis data/track/L1_A.json --limit-kmh 70 --exchange-s 8 --load AW2 \
            --brake-usage 1.0 --stop-window-m 5 \
            --calls build/t400/linia/core-calls.csv
          "$GODOT_BIN" --headless --path src/Game -- \
            --line --limit-kmh=70 --calls="$PWD/build/t400/linia/scene-calls.csv" \
            2>&1 | tee build/t400/linia/scene.log
          # To jest TEN przebieg, na którym zmierzono dziesięć ostrzeżeń kamery goniącej.
          python3 tools/ci/assert_no_godot_warnings.py build/t400/linia/scene.log
          python3 tools/ci/assert_line_calls_match.py \
            build/t400/linia/core-calls.csv build/t400/linia/scene-calls.csv \
            --expect-calls 11
          # Nagłówek ma mówić TĘ SAMĄ liczbę, którą jedzie rdzeń. Do 04.09.2026 mówił
          # `limit=80.0 km/h` przy `--limit-kmh=70`, bo brał ją z `DriveScenario`, czyli
          # z rejestru pojazdu — 80 km/h to prędkość KONSTRUKCYJNA M7. Krok wyżej tego
          # NIE łapie: porównuje zatrzymania, a te były poprawne — kłamał wyłącznie napis.
          # Testy jednostkowe `RunHeaderTests` pilnują `RunHeader`; tutaj sprawdzany jest
          # ten sam wiersz wypisany przez SCENĘ, bo usterka siedziała w `FirstRun.cs`.
          grep -q "^\[PRZEJAZD\] .* limit=70\.0 km/h$" build/t400/linia/scene.log \
            || { echo "BŁĄD: nagłówek nie pokazuje limitu z --limit-kmh=70" >&2
                 grep "^\[PRZEJAZD\]" build/t400/linia/scene.log >&2; exit 1; }

      - name: Negative control of the line comparison
        shell: bash
        # Bramka, która mówi „ok" także wtedy, gdy nic nie sprawdza, jest bezużyteczna
        # (reports/T-310-physics.md §6). Psujemy JEDNĄ liczbę o milimetr i wymagamy,
        # żeby porównanie to zauważyło — próg jest zerowy, więc milimetr wystarcza.
        run: |
          set -euo pipefail
          python3 - <<'NEGPY'
          import csv

          rows = list(csv.reader(open("build/t400/linia/scene-calls.csv", encoding="utf-8")))
          rows[1][3] = repr(float(rows[1][3]) + 0.001)
          with open("build/t400/linia/scene-calls-bad.csv", "w", newline="", encoding="utf-8") as h:
              csv.writer(h).writerows(rows)
          NEGPY
          rc=0
          python3 tools/ci/assert_line_calls_match.py \
            build/t400/linia/core-calls.csv build/t400/linia/scene-calls-bad.csv \
            --expect-calls 11 || rc=$?
          test "$rc" -ne 0 || { echo "BŁĄD: różnica 1 mm przeszła porównanie" >&2; exit 1; }
          echo "[NEGATYW] różnica 1 mm w jednym zatrzymaniu odrzucona, tak jak ma być"

      - name: Line run under signalling gives the SAME calls
        shell: bash
        # Ten sam przejazd, ale prowadzony `LineCore` — czyli linią z nastawnią
        # automatyczną i autorytetem jazdy. Zatrzymania MUSZĄ wyjść identyczne
        # z przejazdem bez sygnalizacji, i to jest cała treść tego kroku: sygnalizacja
        # nie ma prawa dołożyć samotnemu składowi ani jednej sekundy. Gdyby dokładała,
        # każdy zmierzony czas jazdy w tym repozytorium byłby do przeliczenia.
        #
        # Porównanie idzie z plikiem RDZENIA (bez sygnalizacji) z kroku wyżej, a nie
        # z drugim przebiegiem sceny — inaczej zgodność mogłaby zachodzić przez wspólny
        # błąd obu stron.
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path src/Game -- \
            --line --limit-kmh=70 \
            --signalling="$PWD/data/design/signalling/classic-2026.json" \
            --calls="$PWD/build/t400/linia/scene-signalling-calls.csv" \
            2>&1 | tee build/t400/linia/signalling.log
          python3 tools/ci/assert_no_godot_warnings.py build/t400/linia/signalling.log
          grep -q "^\[SYGNALIZACJA\] 23 bloków, 11 tras, wymaga tras: True" \
            build/t400/linia/signalling.log \
            || { echo "BŁĄD: scena nie wczytała planu, którego wymaga ten krok" >&2; exit 1; }
          # Ta sama kontrola co przy przejeździe bez sygnalizacji, i tu WAŻNIEJSZA:
          # prowadzenie składu (`LineDrive`) powstaje leniwie, dopiero w pierwszym kroku,
          # więc w chwili wypisania nagłówka jest jeszcze nullem. Tą właśnie dziurą limit
          # wracał do scenariusza. Liczba musi wyjść z `LineCore`, a nie z planu
          # sygnalizacji — ten ma swój własny wiersz i swoją własną liczbę.
          grep -q "^\[PRZEJAZD\] .* limit=70\.0 km/h$" build/t400/linia/signalling.log \
            || { echo "BŁĄD: nagłówek pod sygnalizacją nie pokazuje limitu przejazdu" >&2
                 grep "^\[PRZEJAZD\]" build/t400/linia/signalling.log >&2; exit 1; }
          python3 tools/ci/assert_line_calls_match.py \
            build/t400/linia/core-calls.csv \
            build/t400/linia/scene-signalling-calls.csv --expect-calls 11

      - name: ATP must really brake above the plan limit
        shell: bash
        # DOWÓD, ŻE OCHRONA POCIĄGU DZIAŁA, A NIE TYLKO LICZY.
        #
        # Do 04.09.2026 `TrainProtection.Supervise` liczyło decyzję, której NIKT nie
        # stosował: jedyne wołanie stało w HUD-zie sceny i było tam opisane jako „odczyt,
        # nie ingerencja". Krok wyżej („SAME calls") tego nie łapał i nie mógł: jedzie
        # z limitem 70 km/h, czyli PONIŻEJ limitu planu 72 km/h, gdzie ochrona milczy.
        # Bramka porównywała więc przejazd bez ingerencji z przejazdem bez ingerencji.
        #
        # Ten krok jedzie z limitem 76 km/h, czyli NAD planem, i wymaga trzech rzeczy:
        #   1. rdzeń melduje niezerowe ingerencje (liczniki są wynikiem, nie napisem —
        #      podnosi je ta sama gałąź, która stosuje decyzję ochrony);
        #   2. scena daje te same zatrzymania co rdzeń, co do bitu — czyli ingeruje
        #      identycznie, a nie „też jakoś";
        #   3. kontrola negatywna niżej: ten sam przejazd BEZ sygnalizacji ma się
        #      RÓŻNIĆ, inaczej punkt 2 byłby zgodnością dwóch przejazdów, w których
        #      ochrona nic nie zrobiła.
        #
        # Zmierzone 04.09.2026 na pakiecie A: 4576 ostrzeżeń i 4576 ingerencji
        # służbowych, największe żądanie 0,863 m/s² przy hamulcu służbowym 1,100 m/s².
        # Przejazd z ochroną trwa 767,33 s wobec 727,19 s bez niej — ochrona SPOWALNIA,
        # bo jest nadzorem, a nie regulatorem prędkości. Ingerencji awaryjnych jest
        # ZERO i tak ma być: 0,863 m/s² mieści się w hamulcu służbowym, więc ta ścieżka
        # zostaje w tym przejeździe nieprzećwiczona (sprawdzają ją testy jednostkowe).
        run: |
          set -euo pipefail
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            line --axis data/track/L1_A.json --limit-kmh 76 --exchange-s 8 --load AW2 \
            --brake-usage 1.0 --stop-window-m 5 \
            --signalling data/design/signalling/classic-2026.json \
            --calls build/t400/linia/core-atp-calls.csv | tee build/t400/linia/core-atp.log
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            line --axis data/track/L1_A.json --limit-kmh 76 --exchange-s 8 --load AW2 \
            --brake-usage 1.0 --stop-window-m 5 \
            --calls build/t400/linia/core-bez-atp-calls.csv
          grep -q "^\[ATP\] ostrzeżenia 4576, ingerencje służbowe 4576, awaryjne 0, największe żądanie 0.863 m/s²" \
            build/t400/linia/core-atp.log \
            || { echo "BŁĄD: rdzeń nie zameldował zmierzonych ingerencji ochrony" >&2; exit 1; }
          "$GODOT_BIN" --headless --path src/Game -- \
            --line --limit-kmh=76 \
            --signalling="$PWD/data/design/signalling/classic-2026.json" \
            --calls="$PWD/build/t400/linia/scene-atp-calls.csv" \
            2>&1 | tee build/t400/linia/scene-atp.log
          python3 tools/ci/assert_no_godot_warnings.py build/t400/linia/scene-atp.log
          python3 tools/ci/assert_line_calls_match.py \
            build/t400/linia/core-atp-calls.csv \
            build/t400/linia/scene-atp-calls.csv --expect-calls 11

      - name: Negative control — the same run without ATP must differ
        shell: bash
        # Gdyby ochrona nic nie zmieniała, krok wyżej przechodziłby tak samo dobrze
        # z plikiem sprzed ingerencji. Wymagamy więc, żeby porównanie ODRZUCIŁO
        # przejazd bez sygnalizacji. Zmierzony rozjazd: 40,13 s w przyjazdach
        # i 0,309 m w miejscu zatrzymania.
        run: |
          set -euo pipefail
          rc=0
          python3 tools/ci/assert_line_calls_match.py \
            build/t400/linia/core-bez-atp-calls.csv \
            build/t400/linia/scene-atp-calls.csv --expect-calls 11 || rc=$?
          test "$rc" -ne 0 || {
            echo "BŁĄD: przejazd BEZ ochrony przeszedł porównanie z przejazdem Z ochroną" >&2
            exit 1
          }
          echo "[NEGATYW] przejazd bez ATP odrzucony wobec przejazdu z ATP, tak jak ma być"

      - name: Line run — a shot at the platform must show open doors
        shell: bash
        # Zrzut z peronu Beekkant. Bramka nie oglądałaby obrazka, więc sprawdza to, co
        # da się sprawdzić maszynowo: że przebieg zatrzymał się TAM, gdzie celowano,
        # i że w chwili migawki prędkość była zerowa. Zmierzone 04.09.2026: warunek
        # tylko na kilometraż przekręcał cały postój (16,5 s) i łapał skład odjeżdżający,
        # bo skład staje 0,3 m PRZED celem.
        run: |
          set -euo pipefail
          mkdir -p build/t400/linia/renders
          xvfb-run -a "$GODOT_BIN" --rendering-driver opengl3 --resolution 1280x720 \
            --path src/Game -- --line --limit-kmh=70 \
            --shot="$PWD/build/t400/linia/renders/LINIA_outside_Beekkant.png" \
            --at-chainage=509.73 --view=outside 2>&1 | tee build/t400/linia/shot.log
          python3 tools/ci/assert_no_godot_warnings.py build/t400/linia/shot.log
          grep -q "v=0.0 km/h" build/t400/linia/shot.log \
            || { echo "BŁĄD: migawka z peronu złapała skład w ruchu" >&2; exit 1; }
          grep -q "chainage=509.4 m" build/t400/linia/shot.log \
            || { echo "BŁĄD: migawka nie na peronie Beekkant" >&2; exit 1; }
          test -s build/t400/linia/renders/LINIA_outside_Beekkant.png
          echo "[LINIA] zrzut z peronu Beekkant: skład stoi na 509,4 m"

      - name: The shot from the platform must contain a platform
        shell: bash
        # DLACZEGO TEN KROK ISTNIEJE. Krok wyżej sprawdzał, że skład STOI tam, gdzie
        # celowano, i że drzwi są otwarte — i to wszystko było prawdą, gdy za oknem
        # nie było peronu. Do 04.09.2026 scena nie wczytywała peronów w ogóle:
        # `station_kit.py` produkował je od T-211, ale nie wołał go ani jeden krok
        # tego workflow, a kadr z kabiny stojącej na Beekkant pokazywał pusty tunel.
        # Żadna bramka tego nie widziała, bo `scene` w metadanych opisuje wyłącznie
        # tunel, `train` wyłącznie skład, a próg pustej klatki mierzy jasność, którą
        # ściany tunelu wypełniają tak samo dobrze bez peronu, jak z nim.
        #
        # Prawda jest tu policzona DWA RAZY niezależnie: ile brył zbudował generator
        # (`--platform-metrics`) i gdzie peron ma leżeć wzdłuż osi (`--platform-layout`,
        # czyli wyjście czystego Pythona). Scena zgłasza to, co naprawdę trzyma.
        run: |
          set -euo pipefail
          python3 tools/ci/assert_shot_metadata.py \
            --metadata build/t400/linia/renders/LINIA_metadata.json \
            --axis data/track/L1_A.json \
            --manifest build/t400/chunks/L1_A-chunks.json \
            --resolution 1280x720 --view outside --at-chainage 509.73 \
            --platform-layout build/t400/L1_A-platforms.json \
            --platform-metrics build/t400/L1_A-platforms-metrics.json \
            | tee build/t400/linia/peron.log
          grep -q "^\[PERON\] 48 brył" build/t400/linia/peron.log \
            || { echo "BŁĄD: scena nie trzyma 48 brył peronowych pakietu A" >&2; exit 1; }
          grep -q "kilometrażu zrzutu 4 brył" build/t400/linia/peron.log \
            || { echo "BŁĄD: przy stojącym składzie nie ma peronu" >&2; exit 1; }

      - name: Negative control of the platform gate
        shell: bash
        # Bramka, która mówi „ok" także wtedy, gdy nic nie sprawdza, jest bezużyteczna
        # (reports/T-310-physics.md §6). Trzy mutacje, każda celująca w INNĄ kontrolę,
        # bo żadna z nich nie łapie tego, co łapią pozostałe:
        #
        #  1. `slabs: 0` — peron w ogóle się nie wczytał. To jest dokładnie stan sceny
        #     sprzed tej zmiany i bramka ma go odrzucać.
        #  2. `near_shot.slabs: 0` przy niezmienionym `slabs: 48` — peron wczytany,
        #     ale nie ma go tam, gdzie stanął skład. Tego pierwsza kontrola nie widzi,
        #     bo obwiednia peronów pakietu ma 5,4 km i zawiera każdy punkt osi.
        #  3. `near_shot.radius_m: 20000` — promień przychodzi OD SCENY, a bramka liczy
        #     nim swoje oczekiwania, więc scena z promieniem 20 km sama sobie rozszerza
        #     bramkę do „gdziekolwiek na pakiecie". Zmierzone 04.09.2026: mutacja
        #     `PlatformNearRadiusM 20.0 -> 20000.0` dawała `near_shot.slabs = 48`
        #     i PRZECHODZIŁA kontrolę z punktu 2, bo przy takim promieniu layout
        #     „luźno" obejmował wszystkie dwanaście peronów.
        run: |
          set -euo pipefail
          for mutacja in slabs near radius; do
            python3 - "$mutacja" <<'NEGPERON'
          import json, sys

          wariant = sys.argv[1]
          meta = json.load(open("build/t400/linia/renders/LINIA_metadata.json",
                                encoding="utf-8"))
          if wariant == "slabs":
              meta["platforms"]["slabs"] = 0
          elif wariant == "near":
              meta["platforms"]["near_shot"]["slabs"] = 0
          else:
              meta["platforms"]["near_shot"]["radius_m"] = 20000.0
              meta["platforms"]["near_shot"]["slabs"] = meta["platforms"]["slabs"]
          with open("build/t400/linia/LINIA_metadata_bad.json", "w", encoding="utf-8") as h:
              json.dump(meta, h, ensure_ascii=False)
          NEGPERON
            rc=0
            python3 tools/ci/assert_shot_metadata.py \
              --metadata build/t400/linia/LINIA_metadata_bad.json \
              --axis data/track/L1_A.json \
              --manifest build/t400/chunks/L1_A-chunks.json \
              --resolution 1280x720 --view outside --at-chainage 509.73 \
              --platform-layout build/t400/L1_A-platforms.json \
              --platform-metrics build/t400/L1_A-platforms-metrics.json || rc=$?
            test "$rc" -ne 0 \
              || { echo "BŁĄD: mutacja '$mutacja' przeszła bramkę peronu" >&2; exit 1; }
            echo "[NEGATYW] mutacja '$mutacja' odrzucona, tak jak ma być"
          done

      - name: Negative control of the comparison
        shell: bash
        # Kontrola, która mówi „ok" także wtedy, gdy nic nie sprawdza, jest bezużyteczna
        # (reports/T-310-physics.md §6). Psujemy jedną liczbę o 4 mm na 4 km i wymagamy,
        # żeby porównanie to zauważyło.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          lines = open('build/t400/godot.csv').read().splitlines()
          row = lines[200].split(',')
          row[3] = repr(float(row[3]) + 0.004)
          lines[200] = ','.join(row)
          open('build/t400/godot_bad.csv', 'w').write('\n'.join(lines) + '\n')
          PY
          if dotnet run --project src/Sim.Runner -c Release --no-build -- \
              compare build/t400/core.csv build/t400/godot_bad.csv --tolerance 1e-9; then
            echo "porównanie przepuściło rozjazd 4 mm — kontrola nic nie kontroluje" >&2
            exit 1
          fi
          echo "negatyw OK — rozjazd 4 mm wykryty"

      - name: Screenshots under Xvfb
        shell: bash
        # --headless wyłącza renderer, więc obrazu tak się nie zrobi. Xvfb plus
        # sterownik opengl3 (llvmpipe) daje prawdziwą klatkę bez karty graficznej.
        run: |
          set -euo pipefail
          mkdir -p build/t400/visual
          for view in cab chase outside; do
            xvfb-run -a "$GODOT_BIN" --rendering-driver opengl3 --resolution 1280x720 \
              --path src/Game -- \
              --shot="$PWD/build/t400/visual/GODOT_${view}_2000m.png" --at-chainage=2000 --view="$view" \
              2>&1 | tee "build/t400/visual/godot-${view}-2000m.log"
            python3 tools/ci/assert_no_godot_warnings.py "build/t400/visual/godot-${view}-2000m.log"
          done
          xvfb-run -a "$GODOT_BIN" --rendering-driver opengl3 --resolution 1280x720 \
            --path src/Game -- \
            --shot="$PWD/build/t400/visual/GODOT_curve_R91_chase.png" --at-chainage=2560 --view=chase \
            2>&1 | tee build/t400/visual/godot-curve-R91-chase.log
          xvfb-run -a "$GODOT_BIN" --rendering-driver opengl3 --resolution 1280x720 \
            --path src/Game -- \
            --shot="$PWD/build/t400/visual/GODOT_seam_c01_c02.png" --at-chainage=976 --view=cab \
            2>&1 | tee build/t400/visual/godot-seam-c01-c02.log
          python3 tools/ci/assert_no_godot_warnings.py \
            build/t400/visual/godot-curve-R91-chase.log \
            build/t400/visual/godot-seam-c01-c02.log
          ls -la build/t400/visual

      - name: Screenshots must not be empty frames
        shell: bash
        # `wc -l` sprawdzało, że plików jest pięć. Czarna klatka 1280x720 z działającym
        # HUD-em to też pięć plików — i dokładnie tak wygląda scena, której nie wczytała
        # się geometria. Ten krok mierzy zawartość klatek tymi samymi metrykami, co
        # rendery Blenderowe (T-012), z progami zmierzonymi na klatce BEZ geometrii.
        run: |
          set -euo pipefail
          test "$(ls build/t400/visual/GODOT_*.png | wc -l)" -eq 5
          python3 tools/visual/compare.py --set godot --current build/t400/visual \
            --prefix GODOT --out build/t400/visual/render-sanity.json \
            --markdown build/t400/visual/render-sanity.md --allow-new-baseline

      - name: Shot metadata must describe this scene
        shell: bash
        # Poprzedni krok woła compare.py BEZ --baseline, a check_geometry przy braku
        # baseline zwraca `new-baseline` i wychodzi ZANIM porówna choć jedną liczbę.
        # W logu widać to wprost: "[WYNIK] pass — {'total': 6, 'pass': 0, 'fail': 0,
        # 'new_baseline': 6}" — zero pass, sześć new_baseline. Metadane sceny nie były
        # więc porównywane z niczym, mimo że docstring WriteShotMetadata mówi, po co
        # istnieją: "compare.py porównuje je liczbowo, bo obraz tego nie wykryje".
        #
        # Zmierzone 02.09.2026 audytem mutacyjnym — przy ZIELONYM CI przechodziły:
        # bbox przesunięty o 1000 m, mesh_objects 0, vertices/faces 0, chunks_loaded
        # o 7 większe niż chunks_declared, podmieniona rozdzielczość i wyzerowane
        # axis_length_m. Baseline nie jest tu rozwiązaniem, bo wyjście Godota nie jest
        # stabilne między wersjami silnika; zamiast tego sprawdzana jest spójność
        # wewnętrzna i zgodność z osią policzoną NIEZALEŻNIE, w Pythonie.
        run: |
          set -euo pipefail
          python3 tools/ci/assert_shot_metadata.py \
            --metadata build/t400/visual/GODOT_metadata.json \
            --axis data/track/L1_A.json \
            --manifest build/t400/chunks/L1_A-chunks.json \
            --resolution 1280x720 \
            --view cab --at-chainage 976 \
            --platform-layout build/t400/L1_A-platforms.json \
            --platform-metrics build/t400/L1_A-platforms-metrics.json

      - name: Negative control of the screenshot check
        shell: bash
        # Kontrola, która przechodzi tylko na poprawnym wejściu, nie dowodzi niczego.
        # `--no-geometry` daje klatkę z samym HUD-em — czyli dokładnie to, co poprzedni
        # krok ma odrzucać.
        #
        # Do 2026-09 ten negatyw przechodził z NIEWŁAŚCIWEGO powodu: `--no-geometry`
        # nie ładuje tunelu, więc FirstRun.cs w ogóle nie zapisuje GODOT_metadata.json,
        # a compare.py wywracał się na „brak metadanych bieżącego przebiegu" — zanim
        # zdążył ocenić zawartość klatek. Rozluźnienie progów pustej klatki nie ruszyło
        # by tego negatywu ani o milimetr. Stąd dwie zmiany: metadane są dokopiowane
        # z przebiegu pozytywnego, a wynik jest czytany z raportu, nie z kodu wyjścia.
        run: |
          set -euo pipefail
          mkdir -p build/t400/negative
          xvfb-run -a "$GODOT_BIN" --rendering-driver opengl3 --resolution 1280x720 \
            --path src/Game -- \
            --shot="$PWD/build/t400/negative/GODOT_cab_2000m.png" \
            --at-chainage=2000 --view=cab --no-geometry \
            2>&1 | tee build/t400/negative/godot-no-geometry.log
          # Scena BEZ geometrii ma być zepsuta na obrazie, a nie w silniku: ten przebieg
          # też nie ma prawa wypisać ostrzeżenia spoza listy.
          python3 tools/ci/assert_no_godot_warnings.py build/t400/negative/godot-no-geometry.log
          for view in chase_2000m outside_2000m curve_R91_chase seam_c01_c02; do
            cp build/t400/negative/GODOT_cab_2000m.png "build/t400/negative/GODOT_${view}.png"
          done
          cp build/t400/visual/GODOT_metadata.json build/t400/negative/GODOT_metadata.json
          rc=0
          python3 tools/visual/compare.py --set godot --current build/t400/negative \
            --prefix GODOT --out build/t400/negative/sanity.json --allow-new-baseline || rc=$?
          test "$rc" -ne 0 || { echo "BŁĄD: klatka bez geometrii przeszła kontrolę zawartości" >&2; exit 1; }
          python3 tools/ci/assert_empty_frame_negative.py build/t400/negative/sanity.json
          echo "[NEGATYW] klatka z samym HUD-em odrzucona, tak jak ma być"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t-400-first-run-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/t400/core.csv
            build/t400/godot.csv
            build/t400/godot_jitter.csv
            build/t400/chunks/L1_A-chunks.json
            build/t400/L1_A-platforms.json
            build/t400/L1_A-platforms-metrics.json
            build/t400/linia/renders/*.png
            build/t400/linia/*.log
            build/t400/visual/*.png
            build/t400/visual/*.json
            build/t400/visual/*.md
            # Logi przebiegów sceny — to na nich stoi bramka ostrzeżeń, więc bez nich
            # nie da się sprawdzić, CO scena wypisała, inaczej niż powtarzając przebieg.
            build/t400/*.log
            build/t400/visual/*.log
            build/t400/negative/*.log
            # Przejazdy linią: bez nich zielony job NIE JEST weryfikacją, tylko obietnicą.
            # `CLAUDE.md` §9 mówi wprost: zadanie jest zweryfikowane po zielonym jobie
            # I SPRAWDZENIU WYMAGANYCH ARTEFAKTÓW — a artefaktu, którego się nie zbiera,
            # nie da się sprawdzić inaczej niż powtarzając cały przebieg. Bramka ATP
            # opiera się na `core-atp.log` i na trzech plikach zatrzymań; do 04.09.2026
            # żaden z nich nie wychodził z runnera.
            build/t400/linia/*.csv
            build/t400/linia/*.log
            # Przejazd ręczny odtworzony z zapisu wejść: telemetria rdzenia, telemetria
            # sceny przy obu rytmach klatek i logi obu przebiegów. Ten sam powód, co
            # przy przejazdach linią — bramki tego kroku czyta się z tych plików.
            build/t400/reczny/*.csv
            build/t400/reczny/*.log
            # Bramka sufitu prędkości i jej negatyw: bez `core.log` i `scene-spf*.log`
            # nie da się sprawdzić, czy obie strony wypisały ten sam wiersz `[LIMIT]`,
            # a bez `core-80.csv` — czy negatyw naprawdę policzył inny przejazd.
            build/t400/limit/*.csv
            build/t400/limit/*.log
            build/t400/limit/*.txt
            # Bramka resetu: bez `core.log` i `scene-spf*.log` nie da się sprawdzić,
            # czy reset naprawdę padł, a bez `po-resecie.csv` / `bez-resetu.csv` — czym
            # dokładnie różnią się przejazdy, gdy porównanie kiedyś padnie.
            build/t400/reset/*.csv
            build/t400/reset/*.log
            build/t400/reset/*.txt
