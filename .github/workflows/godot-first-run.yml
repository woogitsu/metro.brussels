name: Godot first run

# T-400, pierwszy etap. Job odpowiada na jedno pytanie: czy przejazd policzony
# w Godocie jest tym samym przejazdem, co policzony samym rdzeniem.
#
# CLAUDE.md §9: runner właściciela. Godot 4.3 mono i Blender są doinstalowywane
# tylko wtedy, gdy ich nie ma — na maszynie właściciela zostają między przebiegami.

on:
  pull_request:
    paths:
      - '.github/workflows/godot-first-run.yml'
      - 'src/Game/**'
      - 'src/Sim/**'
      - 'src/Sim.Runner/**'
      - 'data/track/L1_A.json'
      - 'data/vehicle/m7-spec.json'
      - 'tools/blender/**'
      # Cały tools/ci, nie pojedynczy skrypt: te joby uruchamiają też
      # apt_install.sh, listy pakietów i (w tunnel-alignment) vehicle_clearance.sh.
      # Przy wąskim wzorcu zmiana takiego pliku nie odpalała własnego CI.
      - 'tools/ci/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.3-stable

jobs:
  first-run:
    # Ten job chodzi na MASZYNIE WŁAŚCICIELA, nie na jednorazowej maszynie GitHuba.
    # Kroki wykonują kod ze sprawdzonego refa — `tools/**`, `doctor.sh`, skrypty CI —
    # więc bez tego warunku wystarczyłby pull request z forka, żeby uruchomić tam
    # dowolny kod. `metro.brussels` jest prywatne, ale ma WŁĄCZONE forkowanie
    # (`allow_forking: true`), więc uzasadnienie „forka nie da się zrobić" tu nie
    # obowiązuje. Warunek nosi KAŻDY job; `needs:` nie jest zamiennikiem, bo job
    # dopisany bez łańcucha zależności nie miałby żadnej ochrony.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Workspace self-hosted runnera JEST WSPÓŁDZIELONY między przebiegami — inaczej
      # niż jednorazowa maszyna GitHuba, która zawsze startuje pusta.
      #
      # Dla tego projektu to nie jest drobiazg, tylko dziura w samej weryfikacji:
      # `CLAUDE.md` §5 mówi, że skrypt bez błędu potrafi wyprodukować pustą scenę,
      # więc bramki sprawdzają PLIKI WYJŚCIOWE. Plik z poprzedniego przebiegu
      # przechodzi te bramki tak samo dobrze jak świeży — job byłby zielony,
      # nie wygenerowawszy niczego.
      #
      # Sprzątaniem zajmuje się samo `actions/checkout`: jego wejście `clean`
      # ma domyślnie `true`, czyli wykonuje `git clean -ffdx && git reset --hard HEAD`,
      # a `-x` obejmuje pliki ignorowane — więc `build/` i `renders/` znikają.
      # Ten krok NIE sprząta, tylko to SPRAWDZA: gdyby ktoś ustawił `clean: false`
      # albo usunął checkout, bramki zaczęłyby oglądać stare wyjścia i nikt by się
      # o tym nie dowiedział. Zaklęcie „rm -rf" nie odróżniłoby tych dwóch sytuacji.
      - name: Workspace jest czysty po checkoucie
        shell: bash
        run: |
          set -euo pipefail
          stale=""
          for path in build renders; do
            [ -e "$path" ] && stale="$stale $path"
          done
          if [ -n "$stale" ]; then
            echo "::error::wyjścia z poprzedniego przebiegu przetrwały checkout:$stale"
            echo "Sprawdź, czy actions/checkout nie ma clean: false — bramki tego"
            echo "projektu sprawdzają pliki wyjściowe i stary plik je przejdzie."
            ls -la $stale
            exit 1
          fi
          echo "build/ i renders/ nie istnieją — bramki zobaczą wyłącznie to, co powstanie w tym przebiegu"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Katalog silnika leży POZA workspace, świadomie. `actions/checkout` wykonuje
      # `git clean -ffdx`, a `-x` obejmuje pliki ignorowane — więc silnik trzymany
      # w workspace znikał przy KAŻDYM checkoucie i był pobierany od nowa (70 MB).
      # Na jednorazowej maszynie GitHuba to było nieuniknione; na maszynie
      # właściciela jest to strata, którą wystarczy przenieść katalog.
      #
      # Dlaczego krokiem, a nie wpisem w `env:` na górze pliku. Bo `${{ runner.* }}`
      # TAM NIE DZIAŁA i nie jest to drobiazg składniowy: workflow-level `env` widzi
      # wyłącznie `github`, `secrets`, `inputs`, `vars` (job-level `env` dokłada
      # `needs`, `strategy`, `matrix`). Kontekst `runner` jest dostępny dopiero
      # w kroku. Pierwsza wersja tej zmiany miała `runner.tool_cache` w `env:` na
      # górze i GitHub ODMÓWIŁ URUCHOMIENIA całego workflow: przebieg 73 zakończył
      # się `failure` w tej samej sekundzie, w której powstał, z zerem jobów.
      # Zmiennej `RUNNER_TOOL_CACHE` używamy więc jako zmiennej powłoki — jest
      # domyślną zmienną środowiskową runnera i wskazuje katalog `_tool`, rodzeństwo
      # workspace'u, którego `git clean` nie dotyka. Fallback na `$HOME`, gdyby jakiś
      # runner jej nie ustawił: liczy się to, żeby katalog był POZA workspace.
      # Wersja jest w ścieżce, więc podniesienie GODOT_VERSION daje nowy katalog
      # zamiast mieszać dwa silniki.
      - name: Katalog silnika poza workspace
        shell: bash
        run: |
          set -euo pipefail
          cache="${RUNNER_TOOL_CACHE:-$HOME/.cache/metro-tools}"
          dir="$cache/metro-godot/${GODOT_VERSION}"
          case "$dir" in
            "$GITHUB_WORKSPACE"/*)
              echo "::error::katalog silnika $dir leży W WORKSPACE — checkout skasuje go przy następnym przebiegu"
              exit 1
              ;;
          esac
          echo "GODOT_DIR=$dir" >> "$GITHUB_ENV"
          echo "silnik poza workspace: $dir"

      # Cache'u GitHuba tu nie ma i nie powinno być: silnik leży teraz poza workspace,
      # więc przeżywa checkout i kolejne przebiegi zastają go na miejscu. `actions/cache`
      # dokładałby do tego pobranie archiwum z sieci po to, żeby odtworzyć katalog,
      # który i tak istnieje.
      - name: Czy Godot już jest
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          binary="$GODOT_DIR/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          # Sam plik wykonywalny nie wystarcza — obok musi leżeć katalog GodotSharp,
          # inaczej silnik nie znajdzie assembly .NET i wywraca się dopiero przy starcie
          # sceny, czyli kilkanaście kroków dalej niż powód.
          if [ -x "$binary" ] && [ -d "$GODOT_DIR/GodotSharp" ]; then
            echo "engine=present" >> "$GITHUB_OUTPUT"
            "$binary" --headless --version
          else
            echo "engine=missing" >> "$GITHUB_OUTPUT"
            echo "Godota nie ma w $GODOT_DIR — krok pobierania go ściągnie."
          fi

      - name: Download Godot mono
        if: steps.godot.outputs.engine == 'missing'
        shell: bash
        # Wersja mono jest konieczna: przejazd jest w C# i korzysta z MetroBxl.Sim.
        # Sam plik wykonywalny nie wystarczy — obok musi leżeć katalog GodotSharp,
        # inaczej silnik nie znajdzie assembly .NET i wywraca się przy starcie.
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_DIR"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          curl -fsSL -o /tmp/godot-mono.zip "$url"
          unzip -q /tmp/godot-mono.zip -d /tmp/godot-mono
          mv /tmp/godot-mono/Godot_v${GODOT_VERSION}_mono_linux_x86_64/* "$GODOT_DIR/"
          ls -la "$GODOT_DIR"

      - name: Report tool versions
        shell: bash
        run: |
          set -euo pipefail
          echo "GODOT_BIN=$GODOT_DIR/Godot_v${GODOT_VERSION}_mono_linux.x86_64" >> "$GITHUB_ENV"
          "$GODOT_DIR/Godot_v${GODOT_VERSION}_mono_linux.x86_64" --headless --version
          dotnet --version

      - name: Core stays free of the engine
        shell: bash
        # Rdzeń buduje się bez Godota, więc projekt Godota nie może być w MetroBxl.sln.
        # Gdyby tam trafił, `dotnet build MetroBxl.sln` z sim-tests.yml zaczęłoby
        # ściągać Godot.NET.Sdk i reguła 9 z CLAUDE.md przestałaby cokolwiek znaczyć.
        run: |
          set -euo pipefail
          # Bez tego `test -f` bramka ogłaszałaby sukces po zniknięciu pliku:
          # grep bez celu zwraca 2, a `if grep ...; then` czyta to jak brak trafień.
          test -f MetroBxl.sln || { echo "brak MetroBxl.sln — bramka nie ma czego sprawdzić" >&2; exit 1; }
          if grep -q 'MetroBxl.Game' MetroBxl.sln; then
            echo "projekt Godota trafił do MetroBxl.sln — rdzeń przestałby się budować bez silnika" >&2
            exit 1
          fi
          echo "MetroBxl.sln: bez projektu Godota"

      - name: Build core and console runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet build MetroBxl.sln --configuration Release

      - name: Build the Godot project
        shell: bash
        run: dotnet build src/Game/MetroBxl.Game.csproj --configuration Debug

      # Na jednorazowej maszynie GitHuba Blender trzeba było instalować za każdym
      # razem — 162 pakiety, 190 MB. Na maszynie właściciela zostaje zainstalowany,
      # więc instalacja przy każdym przebiegu byłaby marnotrawstwem i niepotrzebnym
      # `sudo`. Ten krok sprawdza, czy jest; instalacja i cache odpalają się tylko,
      # gdy go brak. Świeży runner nadal działa bez ręcznego przygotowania.
      - name: Czy Blender i renderer programowy już są
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          # Ten job potrzebuje OBU: Blendera do geometrii i `xvfb-run` do zrzutów,
          # bo `--headless` wyłącza renderer. Brak któregokolwiek znaczy instalację
          # całego zestawu `blender-xvfb` — sprawdzanie ich osobno dałoby stan,
          # w którym cache jest pominięty, a instalacja i tak potrzebna.
          if command -v blender >/dev/null 2>&1 && command -v xvfb-run >/dev/null 2>&1; then
            echo "blender=present" >> "$GITHUB_OUTPUT"
            blender --version | sed -n '1,2p'
          else
            echo "blender=missing" >> "$GITHUB_OUTPUT"
            command -v blender >/dev/null 2>&1 || echo "brak: blender"
            command -v xvfb-run >/dev/null 2>&1 || echo "brak: xvfb-run"
          fi

      - name: Cache pakietów apt
        if: steps.tools.outputs.blender == 'missing'
        uses: actions/cache@v4
        with:
          path: ~/.cache/metro-apt
          key: apt-${{ runner.os }}-blender-xvfb-${{ hashFiles('tools/ci/apt-packages/blender-xvfb.txt') }}
          restore-keys: apt-${{ runner.os }}-blender-xvfb-

      - name: Install Blender and a software renderer
        if: steps.tools.outputs.blender == 'missing'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export APT_CACHE_DIR="$HOME/.cache/metro-apt"
          bash tools/ci/apt_install.sh --set blender-xvfb
          blender --version | sed -n '1,2p'

      - name: Generate package A geometry
        shell: bash
        # Chunki i skorupa M7 nie są w repozytorium (CLAUDE.md reguła 8). Powstają
        # z generatora tu i teraz — job sprawdza więc także to, że scena wczytuje
        # świeżo wygenerowaną geometrię, a nie kopię sprzed miesięcy.
        run: |
          set -euo pipefail
          blender --background --python-exit-code 7 --python tools/blender/tunnel_sweep.py -- \
            --centerline data/track/L1_A.json --profile box_double --name L1_A \
            --out build/t400/L1_A.glb --metrics build/t400/L1_A-metrics.json \
            --chunk-dir build/t400/chunks --chunk-manifest build/t400/chunks/L1_A-chunks.json
          blender --background --python-exit-code 7 --python tools/blender/m7_shell.py -- \
            --out build/t400/M7_shell.glb --envelope-out build/t400/M7_envelope.glb \
            --report build/t400/M7_shell.json
          ls -la build/t400 build/t400/chunks | sed -n '1,20p'

      - name: Axis in C# matches the sweep manifest
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            axis --axis data/track/L1_A.json --manifest build/t400/chunks/L1_A-chunks.json

      - name: Controller is still the T-310 core
        shell: bash
        run: dotnet run --project src/Sim.Runner -c Release --no-build -- parity

      - name: Reference run from the core alone
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/Sim.Runner -c Release --no-build -- drive --out build/t400/core.csv
          wc -l build/t400/core.csv

      - name: Godot run, 120 steps per frame
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path src/Game -- \
            --telemetry="$PWD/build/t400/godot.csv" --steps-per-frame=120
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            compare build/t400/core.csv build/t400/godot.csv --tolerance 0

      - name: Godot run, uneven frames
        shell: bash
        # Ten sam przejazd przy innym, celowo nierównym rytmie klatek. Jeżeli krok
        # stały działa, telemetria musi wyjść identyczna — nie „podobna".
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path src/Game -- \
            --telemetry="$PWD/build/t400/godot_jitter.csv" --steps-per-frame=37 --jitter=0.45
          dotnet run --project src/Sim.Runner -c Release --no-build -- \
            compare build/t400/core.csv build/t400/godot_jitter.csv --tolerance 0

      - name: Negative control of the comparison
        shell: bash
        # Kontrola, która mówi „ok" także wtedy, gdy nic nie sprawdza, jest bezużyteczna
        # (reports/T-310-physics.md §6). Psujemy jedną liczbę o 4 mm na 4 km i wymagamy,
        # żeby porównanie to zauważyło.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          lines = open('build/t400/godot.csv').read().splitlines()
          row = lines[200].split(',')
          row[3] = repr(float(row[3]) + 0.004)
          lines[200] = ','.join(row)
          open('build/t400/godot_bad.csv', 'w').write('\n'.join(lines) + '\n')
          PY
          if dotnet run --project src/Sim.Runner -c Release --no-build -- \
              compare build/t400/core.csv build/t400/godot_bad.csv --tolerance 1e-9; then
            echo "porównanie przepuściło rozjazd 4 mm — kontrola nic nie kontroluje" >&2
            exit 1
          fi
          echo "negatyw OK — rozjazd 4 mm wykryty"

      - name: Screenshots under Xvfb
        shell: bash
        # --headless wyłącza renderer, więc obrazu tak się nie zrobi. Xvfb plus
        # sterownik opengl3 (llvmpipe) daje prawdziwą klatkę bez karty graficznej.
        run: |
          set -euo pipefail
          mkdir -p build/t400/visual
          for view in cab chase outside; do
            xvfb-run -a "$GODOT_BIN" --rendering-driver opengl3 --resolution 1280x720 \
              --path src/Game -- \
              --shot="$PWD/build/t400/visual/GODOT_${view}_2000m.png" --at-chainage=2000 --view="$view"
          done
          xvfb-run -a "$GODOT_BIN" --rendering-driver opengl3 --resolution 1280x720 \
            --path src/Game -- \
            --shot="$PWD/build/t400/visual/GODOT_curve_R91_chase.png" --at-chainage=2560 --view=chase
          xvfb-run -a "$GODOT_BIN" --rendering-driver opengl3 --resolution 1280x720 \
            --path src/Game -- \
            --shot="$PWD/build/t400/visual/GODOT_seam_c01_c02.png" --at-chainage=976 --view=cab
          ls -la build/t400/visual

      - name: Screenshots must not be empty frames
        shell: bash
        # `wc -l` sprawdzało, że plików jest pięć. Czarna klatka 1280x720 z działającym
        # HUD-em to też pięć plików — i dokładnie tak wygląda scena, której nie wczytała
        # się geometria. Ten krok mierzy zawartość klatek tymi samymi metrykami, co
        # rendery Blenderowe (T-012), z progami zmierzonymi na klatce BEZ geometrii.
        run: |
          set -euo pipefail
          test "$(ls build/t400/visual/GODOT_*.png | wc -l)" -eq 5
          python3 tools/visual/compare.py --set godot --current build/t400/visual \
            --prefix GODOT --out build/t400/visual/render-sanity.json \
            --markdown build/t400/visual/render-sanity.md --allow-new-baseline

      - name: Shot metadata must describe this scene
        shell: bash
        # Poprzedni krok woła compare.py BEZ --baseline, a check_geometry przy braku
        # baseline zwraca `new-baseline` i wychodzi ZANIM porówna choć jedną liczbę.
        # W logu widać to wprost: "[WYNIK] pass — {'total': 6, 'pass': 0, 'fail': 0,
        # 'new_baseline': 6}" — zero pass, sześć new_baseline. Metadane sceny nie były
        # więc porównywane z niczym, mimo że docstring WriteShotMetadata mówi, po co
        # istnieją: "compare.py porównuje je liczbowo, bo obraz tego nie wykryje".
        #
        # Zmierzone 02.09.2026 audytem mutacyjnym — przy ZIELONYM CI przechodziły:
        # bbox przesunięty o 1000 m, mesh_objects 0, vertices/faces 0, chunks_loaded
        # o 7 większe niż chunks_declared, podmieniona rozdzielczość i wyzerowane
        # axis_length_m. Baseline nie jest tu rozwiązaniem, bo wyjście Godota nie jest
        # stabilne między wersjami silnika; zamiast tego sprawdzana jest spójność
        # wewnętrzna i zgodność z osią policzoną NIEZALEŻNIE, w Pythonie.
        run: |
          set -euo pipefail
          python3 tools/ci/assert_shot_metadata.py \
            --metadata build/t400/visual/GODOT_metadata.json \
            --axis data/track/L1_A.json \
            --resolution 1280x720 \
            --view cab --at-chainage 976

      - name: Negative control of the screenshot check
        shell: bash
        # Kontrola, która przechodzi tylko na poprawnym wejściu, nie dowodzi niczego.
        # `--no-geometry` daje klatkę z samym HUD-em — czyli dokładnie to, co poprzedni
        # krok ma odrzucać.
        #
        # Do 2026-09 ten negatyw przechodził z NIEWŁAŚCIWEGO powodu: `--no-geometry`
        # nie ładuje tunelu, więc FirstRun.cs w ogóle nie zapisuje GODOT_metadata.json,
        # a compare.py wywracał się na „brak metadanych bieżącego przebiegu" — zanim
        # zdążył ocenić zawartość klatek. Rozluźnienie progów pustej klatki nie ruszyło
        # by tego negatywu ani o milimetr. Stąd dwie zmiany: metadane są dokopiowane
        # z przebiegu pozytywnego, a wynik jest czytany z raportu, nie z kodu wyjścia.
        run: |
          set -euo pipefail
          mkdir -p build/t400/negative
          xvfb-run -a "$GODOT_BIN" --rendering-driver opengl3 --resolution 1280x720 \
            --path src/Game -- \
            --shot="$PWD/build/t400/negative/GODOT_cab_2000m.png" \
            --at-chainage=2000 --view=cab --no-geometry
          for view in chase_2000m outside_2000m curve_R91_chase seam_c01_c02; do
            cp build/t400/negative/GODOT_cab_2000m.png "build/t400/negative/GODOT_${view}.png"
          done
          cp build/t400/visual/GODOT_metadata.json build/t400/negative/GODOT_metadata.json
          rc=0
          python3 tools/visual/compare.py --set godot --current build/t400/negative \
            --prefix GODOT --out build/t400/negative/sanity.json --allow-new-baseline || rc=$?
          test "$rc" -ne 0 || { echo "BŁĄD: klatka bez geometrii przeszła kontrolę zawartości" >&2; exit 1; }
          python3 tools/ci/assert_empty_frame_negative.py build/t400/negative/sanity.json
          echo "[NEGATYW] klatka z samym HUD-em odrzucona, tak jak ma być"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t-400-first-run-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/t400/core.csv
            build/t400/godot.csv
            build/t400/godot_jitter.csv
            build/t400/chunks/L1_A-chunks.json
            build/t400/visual/*.png
            build/t400/visual/*.json
            build/t400/visual/*.md
