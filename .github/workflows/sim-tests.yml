name: Sim core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sim:
    # CLAUDE.md §9: CI chodzi na self-hosted runnerze od 2026-09-02, po wyczerpaniu
    # minut GitHub Actions. SDK instalujemy jawnie z tego samego powodu, co wcześniej —
    # tylko powód się przesunął: na jednorazowej maszynie GitHuba wersja .NET zmieniała
    # się z miesiąca na miesiąc, a na maszynie właściciela zależy od tego, co tam stoi.
    # W obu wypadkach pin jest jedyną odpowiedzią.
    # Ten job chodzi na MASZYNIE WŁAŚCICIELA, nie na jednorazowej maszynie GitHuba.
    # Kroki wykonują kod ze sprawdzonego refa — `tools/**`, `doctor.sh`, skrypty CI —
    # więc bez tego warunku wystarczyłby pull request z forka, żeby uruchomić tam
    # dowolny kod. `metro.brussels` jest prywatne, ale ma WŁĄCZONE forkowanie
    # (`allow_forking: true`), więc uzasadnienie „forka nie da się zrobić" tu nie
    # obowiązuje. Warunek nosi KAŻDY job; `needs:` nie jest zamiennikiem, bo job
    # dopisany bez łańcucha zależności nie miałby żadnej ochrony.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, woogitsu, i5-10400f, nvidia-gtx1070]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Kontrola czystego workspace: JEDNA implementacja w
      # `.github/actions/check-workspace`, nie kopia w każdym workflow. Powód
      # i mechanika są w samej akcji.
      - name: Workspace jest czysty po checkoucie
        uses: ./.github/actions/check-workspace

      # `setup-dotnet` domyślnie instaluje do `/usr/share/dotnet`, a runner
      # właściciela nie ma tam prawa zapisu — cały krok kończył się serią
      # `mkdir: Permission denied` i `cp: cannot create directory
      # '/usr/share/dotnet/sdk/10.0.400/': Permission denied`. Na jednorazowej
      # maszynie GitHuba działało, bo tam runner jest rootem.
      #
      # Katalog idzie więc tam, gdzie już leży Godot: `RUNNER_TOOL_CACHE`, czyli
      # `_tool`, rodzeństwo workspace'u. Załatwia to dwie rzeczy naraz — prawa
      # zapisu ORAZ przetrwanie `git clean -ffdx` z `actions/checkout`.
      #
      # `runner.tool_cache` NIE działa w `env:` na poziomie workflow ani joba
      # (GitHub odrzuca wtedy cały workflow), więc zmienna powstaje w kroku.
      - name: Katalog SDK poza /usr/share i poza workspace
        shell: bash
        run: |
          set -euo pipefail
          cache="${RUNNER_TOOL_CACHE:-$HOME/.cache/metro-tools}"
          dir="$cache/metro-dotnet"
          case "$dir" in
            "$GITHUB_WORKSPACE"/*)
              echo "::error::katalog SDK $dir leży W WORKSPACE — checkout skasuje go przy następnym przebiegu"
              exit 1
              ;;
            /usr/*)
              echo "::error::katalog SDK $dir leży w /usr — runner nie ma tam prawa zapisu"
              exit 1
              ;;
          esac
          mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"
          echo "SDK poleci do $dir"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Report .NET version
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version
          dotnet --list-sdks

      - name: Restore
        shell: bash
        run: dotnet restore MetroBxl.sln

      - name: Build
        shell: bash
        # Ostrzeżenia w src/Sim są błędami (TreatWarningsAsErrors), więc build jest
        # tu też kontrolą jakości, a nie samym warunkiem uruchomienia testów.
        run: dotnet build MetroBxl.sln --configuration Release --no-restore

      - name: Test
        shell: bash
        run: dotnet test tests/Sim.Tests --configuration Release --no-build --verbosity normal

      - name: Core has no engine dependency
        shell: bash
        # Reguła 9 z CLAUDE.md pilnowana także poza testami: gdyby ktoś dopisał
        # użycie Godota do rdzenia, ma to zatrzymać PR, a nie czekać na T-400.
        # Wzorzec celuje w kod (dyrektywa using i kwalifikowany typ), a nie w słowo
        # „Godot" w komentarzu — inaczej kontrola wywracałaby się na własnym opisie.
        run: |
          set -euo pipefail
          # grep bez celu kończy się kodem 2, a `if grep ...; then` czyta to tak samo
          # jak „nic nie znalazłem". Bramka bez pliku ogłaszałaby więc sukces, gdyby
          # ktoś przeniósł rdzeń gdzie indziej. Najpierw istnienie celu, potem treść.
          test -d src/Sim || { echo "brak katalogu src/Sim — bramka reguły 9 nie ma czego sprawdzić" >&2; exit 1; }
          if grep -rnE '^[[:space:]]*using[[:space:]]+Godot([.;]|[[:space:]])|Godot\.[A-Za-z]' \
              --include='*.cs' --include='*.csproj' src/Sim; then
            echo "src/Sim odwołuje się do Godota — CLAUDE.md reguła 9" >&2
            exit 1
          fi
          echo "src/Sim: brak odwołań do Godota"

      - name: Core has no NuGet dependencies
        shell: bash
        # Dyscyplina bezzależnościowa rdzenia. Pakiety są dozwolone wyłącznie
        # w projekcie testowym. Szukamy elementu XML, a nie samego słowa: komentarz
        # w Sim.csproj wyjaśnia właśnie tę regułę i sam zawiera to słowo.
        run: |
          set -euo pipefail
          test -f src/Sim/Sim.csproj || { echo "brak src/Sim/Sim.csproj — bramka NuGet nie ma czego sprawdzić" >&2; exit 1; }
          if grep -nE '<[[:space:]]*PackageReference' src/Sim/Sim.csproj; then
            echo "src/Sim dostał zależność NuGet — to wymaga decyzji, nie commita" >&2
            exit 1
          fi
          echo "src/Sim: zero PackageReference"

      - name: Reference parity is still reproducible from Python
        shell: bash
        # Snapshot liczb referencyjnych żyje w tests/Sim.Tests/PythonReference.cs
        # i jest ręcznie przepisany. Do 2026-09 ten krok był samym `print`: obcięcie
        # mocy trakcji w reference.py o 10 % przesuwało drogę rozruchu z 337,5 m
        # na 371,3 m, a `dotnet test` dalej dawał Passed: 252. Teraz test przelicza
        # wszystkie 24 stałe od nowa i porównuje je z plikiem C# na pełnej precyzji,
        # więc rozjazd wywraca job zamiast przewijać się w logu.
        run: |
          set -euo pipefail
          python3 tools/physics/reference.py
          python3 tools/tests/test_reference_snapshot.py

      - name: Golden line trace matches the core byte for byte
        shell: bash
        # 6.D1. Do 2026-09 to porównanie zostało wykonane RAZ, ręcznie, w commicie
        # `90a8c31`: sześć osi, 453 107 wierszy, „IDENTYCZNY" przy każdej. Od tamtej
        # pory nie chodziło — i przestało być prawdą. Zmierzone 2026-09-06: sześć osi
        # daje 515 807 wierszy, o 62 700 więcej, dokładnie +1140 na każdy postój.
        #
        # DLACZEGO WZORZEC NIE JEST PLIKIEM. Pełne ślady to 32,0 MiB, a `CLAUDE.md`
        # §4.8 zabrania komitować plików > 10 MB. Wzorzec jest więc parą: suma
        # SHA-256 całego pliku WYKRYWA rozjazd co do bajtu, a próbka co 100 wierszy
        # leżąca w `tests/data/golden-trace/` go LOKALIZUJE. Sama próbka
        # przepuściłaby rozjazd między jej wierszami; sama suma nie powie, gdzie.
        run: |
          set -euo pipefail
          # RUNNER_TEMP, nie współdzielone /tmp: cztery runnery puli stoją na jednej
          # maszynie, a ślad ma stałą nazwę na oś. Z tego samego powodu, co bramka
          # tablic hamowania wyżej.
          TRACES="$RUNNER_TEMP/trace"
          rm -rf "$TRACES"; mkdir -p "$TRACES"
          for AXIS in L1_A L1_B L2_E L5_C L5_D L6_F; do
              dotnet run --project src/Sim.Runner --configuration Release --no-build -- line \
                  --axis "data/track/$AXIS.json" --limit-kmh 72 --exchange-s 20 \
                  --trace "$TRACES/$AXIS.csv" > /dev/null
          done
          wc -l "$TRACES"/*.csv
          python3 tools/ci/assert_line_trace.py --traces "$TRACES"

      - name: Golden trace gate can actually go red
        shell: bash
        # Bramka, która nigdy nie zaświeciła, jest zdaniem o sobie, nie pomiarem.
        # Ten krok psuje JEDEN znak w JEDNYM wierszu kopii śladu i wymaga, żeby
        # narzędzie odmówiło. Odwrotność (`! python3 …`) jest tu warunkiem: krok
        # zielony przy nietkniętym pliku nie dowodziłby niczego.
        run: |
          set -euo pipefail
          TRACES="$RUNNER_TEMP/trace-uszkodzony"
          rm -rf "$TRACES"; cp -r "$RUNNER_TEMP/trace" "$TRACES"
          python3 - "$TRACES/L5_D.csv" <<'PSUJ'
          import sys
          path = sys.argv[1]
          rows = open(path, encoding="utf-8").read().splitlines()
          rows[2909] = rows[2909].replace(",0,", ",1,", 1)
          open(path, "w", encoding="utf-8").write("\n".join(rows) + "\n")
          PSUJ
          if python3 tools/ci/assert_line_trace.py --traces "$TRACES"; then
              echo "BŁĄD: bramka przyjęła uszkodzony ślad" >&2
              exit 1
          fi
          echo "kontrola negatywna: bramka odmówiła uszkodzonego śladu"

      - name: Upload traces on failure
        # Bramka podaje PRZEDZIAŁ wierszy, bo próbka ma krok 100. Dokładny numer daje
        # `Sim.Runner compare` na dwóch pełnych plikach — a pełnego wzorca w repo nie
        # ma i mieć nie może. Artefakt jest więc tym brakującym drugim plikiem: bez
        # niego „przedział 2903..3002" byłby końcem śledztwa, a nie jego początkiem.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: line-trace-${{ github.run_id }}
          path: ${{ runner.temp }}/trace/*.csv
          retention-days: 7

      - name: Core step cost at nine trains is under budget
        shell: bash
        # 6.D2. `reports/linecore-budget.md` zmierzył koszt kroku RAZ, 05.09.2026,
        # i na tym się skończyło. Pomiar wykonany raz mówi o dniu, w którym go
        # wykonano; regres wyszedłby dopiero wtedy, gdyby ktoś zechciał go powtórzyć.
        #
        # PRÓG NIE STOI W TYM PLIKU i to jest warunek, nie wygoda. Stoi w
        # `tools/ci/linecore-step-budget.json` razem ze scenariuszem, bo liczba
        # wpisana w dwóch miejscach rozjeżdża się przy pierwszej zmianie — dokładnie
        # ta rodzina usterki, którą łapie bramka z #273. Krok woła skrypt i nic
        # nie porównuje sam; pilnuje tego `tools/tests/test_linecore_budget_gate.py`.
        run: |
          set -euo pipefail
          python3 tools/ci/assert_linecore_budget.py

      - name: Core step gate can actually go red
        shell: bash
        # Bramka, która nigdy nie zaświeciła, jest zdaniem o sobie, nie pomiarem.
        # DWIE kontrole, bo bramka ma dwa niezależne warunki, a druga jest ważniejsza
        # od pierwszej: 6.A12 (#308) zmierzyła, że `budget --trains 32` melduje
        # `N_max = 1`, kiedy okno jest krótsze niż jeden odstęp. Kolumna µs/krok ma
        # wtedy wartość — tylko opisuje przejazd JEDNEGO składu, mieszczący się
        # w progu z ogromnym zapasem. Bramka czytająca samą liczbę mikrosekund
        # przeszłaby wtedy na zielono i nazwała ten pomiar dziewięcioma składami.
        run: |
          set -euo pipefail
          POMIARY="$RUNNER_TEMP/budzet-kontrola"
          rm -rf "$POMIARY"; mkdir -p "$POMIARY"
          naglowek='[BUDŻET] N_zgł;N_max;N_śr;czeka_śr;mediana_kroków_s;min;max;rozstęp_%;µs_krok;CPU/ścienny;%budżetu'
          printf '%s\n[BUDŻET] 32;9;5.08;0.98;110000;100000;120000;9.1;9.091;1.00;0.11\n' \
              "$naglowek" > "$POMIARY/wolny.txt"
          printf '%s\n[BUDŻET] 32;1;1.00;0.00;265081;223360;268544;17.0;3.772;1.01;0.05\n' \
              "$naglowek" > "$POMIARY/jeden.txt"
          if python3 tools/ci/assert_linecore_budget.py --from-output "$POMIARY/wolny.txt"; then
              echo "BŁĄD: bramka przyjęła krok wolniejszy od progu" >&2
              exit 1
          fi
          if python3 tools/ci/assert_linecore_budget.py --from-output "$POMIARY/jeden.txt"; then
              echo "BŁĄD: bramka przyjęła pomiar JEDNEGO składu jako pomiar dziewięciu" >&2
              exit 1
          fi
          echo "kontrola negatywna: bramka odmówiła wolnego kroku i pomiaru jednego składu"

      - name: Braking reference matches the core byte for byte
        shell: bash
        # T-311: tablice hamowania powstają dwa razy — raz w rdzeniu (src/Sim.Runner
        # braking), raz w niezależnej referencji Pythona (tools/physics/braking.py).
        # To nie jest wydruk do logu, tylko bramka: `diff` wywraca job, gdy obie drogi
        # przestaną dawać tę samą liczbę.
        run: |
          set -euo pipefail
          # Pliki w RUNNER_TEMP, nie we współdzielonym /tmp: cztery runnery puli
          # stoją na jednej maszynie, a ta bramka porównuje DWA pliki. Przy stałych
          # nazwach dwa równoległe joby nadpisywałyby je sobie nawzajem i `diff`
          # zestawiałby rdzeń z jednego przebiegu z referencją z drugiego — wynik
          # zielony albo czerwony, w obu wypadkach nie o tym, o co pyta bramka.
          dotnet run --project src/Sim.Runner --configuration Release --no-build -- braking > "$RUNNER_TEMP/braking_core.txt"
          python3 tools/physics/braking.py > "$RUNNER_TEMP/braking_reference.txt"
          diff -u "$RUNNER_TEMP/braking_reference.txt" "$RUNNER_TEMP/braking_core.txt"
          echo "tablice hamowania: rdzeń == referencja, co do bajtu"
