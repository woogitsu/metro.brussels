name: Sim core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sim:
    # CLAUDE.md §9: CI chodzi na self-hosted runnerze od 2026-09-02, po wyczerpaniu
    # minut GitHub Actions. SDK instalujemy jawnie z tego samego powodu, co wcześniej —
    # tylko powód się przesunął: na jednorazowej maszynie GitHuba wersja .NET zmieniała
    # się z miesiąca na miesiąc, a na maszynie właściciela zależy od tego, co tam stoi.
    # W obu wypadkach pin jest jedyną odpowiedzią.
    # Ten job chodzi na MASZYNIE WŁAŚCICIELA, nie na jednorazowej maszynie GitHuba.
    # Kroki wykonują kod ze sprawdzonego refa — `tools/**`, `doctor.sh`, skrypty CI —
    # więc bez tego warunku wystarczyłby pull request z forka, żeby uruchomić tam
    # dowolny kod. `metro.brussels` jest prywatne, ale ma WŁĄCZONE forkowanie
    # (`allow_forking: true`), więc uzasadnienie „forka nie da się zrobić" tu nie
    # obowiązuje. Warunek nosi KAŻDY job; `needs:` nie jest zamiennikiem, bo job
    # dopisany bez łańcucha zależności nie miałby żadnej ochrony.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Workspace self-hosted runnera JEST WSPÓŁDZIELONY między przebiegami — inaczej
      # niż jednorazowa maszyna GitHuba, która zawsze startuje pusta.
      #
      # Dla tego projektu to nie jest drobiazg, tylko dziura w samej weryfikacji:
      # `CLAUDE.md` §5 mówi, że skrypt bez błędu potrafi wyprodukować pustą scenę,
      # więc bramki sprawdzają PLIKI WYJŚCIOWE. Plik z poprzedniego przebiegu
      # przechodzi te bramki tak samo dobrze jak świeży — job byłby zielony,
      # nie wygenerowawszy niczego.
      #
      # Sprzątaniem zajmuje się samo `actions/checkout`: jego wejście `clean`
      # ma domyślnie `true`, czyli wykonuje `git clean -ffdx && git reset --hard HEAD`,
      # a `-x` obejmuje pliki ignorowane — więc `build/` i `renders/` znikają.
      # Ten krok NIE sprząta, tylko to SPRAWDZA: gdyby ktoś ustawił `clean: false`
      # albo usunął checkout, bramki zaczęłyby oglądać stare wyjścia i nikt by się
      # o tym nie dowiedział. Zaklęcie „rm -rf" nie odróżniłoby tych dwóch sytuacji.
      - name: Workspace jest czysty po checkoucie
        shell: bash
        run: |
          set -euo pipefail
          stale=""
          for path in build renders; do
            [ -e "$path" ] && stale="$stale $path"
          done
          if [ -n "$stale" ]; then
            echo "::error::wyjścia z poprzedniego przebiegu przetrwały checkout:$stale"
            echo "Sprawdź, czy actions/checkout nie ma clean: false — bramki tego"
            echo "projektu sprawdzają pliki wyjściowe i stary plik je przejdzie."
            ls -la $stale
            exit 1
          fi
          echo "build/ i renders/ nie istnieją — bramki zobaczą wyłącznie to, co powstanie w tym przebiegu"

      # `setup-dotnet` domyślnie instaluje do `/usr/share/dotnet`, a runner
      # właściciela nie ma tam prawa zapisu — cały krok kończył się serią
      # `mkdir: Permission denied` i `cp: cannot create directory
      # '/usr/share/dotnet/sdk/10.0.400/': Permission denied`. Na jednorazowej
      # maszynie GitHuba działało, bo tam runner jest rootem.
      #
      # Katalog idzie więc tam, gdzie już leży Godot: `RUNNER_TOOL_CACHE`, czyli
      # `_tool`, rodzeństwo workspace'u. Załatwia to dwie rzeczy naraz — prawa
      # zapisu ORAZ przetrwanie `git clean -ffdx` z `actions/checkout`.
      #
      # `runner.tool_cache` NIE działa w `env:` na poziomie workflow ani joba
      # (GitHub odrzuca wtedy cały workflow), więc zmienna powstaje w kroku.
      - name: Katalog SDK poza /usr/share i poza workspace
        shell: bash
        run: |
          set -euo pipefail
          cache="${RUNNER_TOOL_CACHE:-$HOME/.cache/metro-tools}"
          dir="$cache/metro-dotnet"
          case "$dir" in
            "$GITHUB_WORKSPACE"/*)
              echo "::error::katalog SDK $dir leży W WORKSPACE — checkout skasuje go przy następnym przebiegu"
              exit 1
              ;;
            /usr/*)
              echo "::error::katalog SDK $dir leży w /usr — runner nie ma tam prawa zapisu"
              exit 1
              ;;
          esac
          mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"
          echo "SDK poleci do $dir"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Report .NET version
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version
          dotnet --list-sdks

      - name: Restore
        shell: bash
        run: dotnet restore MetroBxl.sln

      - name: Build
        shell: bash
        # Ostrzeżenia w src/Sim są błędami (TreatWarningsAsErrors), więc build jest
        # tu też kontrolą jakości, a nie samym warunkiem uruchomienia testów.
        run: dotnet build MetroBxl.sln --configuration Release --no-restore

      - name: Test
        shell: bash
        run: dotnet test tests/Sim.Tests --configuration Release --no-build --verbosity normal

      - name: Core has no engine dependency
        shell: bash
        # Reguła 9 z CLAUDE.md pilnowana także poza testami: gdyby ktoś dopisał
        # użycie Godota do rdzenia, ma to zatrzymać PR, a nie czekać na T-400.
        # Wzorzec celuje w kod (dyrektywa using i kwalifikowany typ), a nie w słowo
        # „Godot" w komentarzu — inaczej kontrola wywracałaby się na własnym opisie.
        run: |
          set -euo pipefail
          # grep bez celu kończy się kodem 2, a `if grep ...; then` czyta to tak samo
          # jak „nic nie znalazłem". Bramka bez pliku ogłaszałaby więc sukces, gdyby
          # ktoś przeniósł rdzeń gdzie indziej. Najpierw istnienie celu, potem treść.
          test -d src/Sim || { echo "brak katalogu src/Sim — bramka reguły 9 nie ma czego sprawdzić" >&2; exit 1; }
          if grep -rnE '^[[:space:]]*using[[:space:]]+Godot([.;]|[[:space:]])|Godot\.[A-Za-z]' \
              --include='*.cs' --include='*.csproj' src/Sim; then
            echo "src/Sim odwołuje się do Godota — CLAUDE.md reguła 9" >&2
            exit 1
          fi
          echo "src/Sim: brak odwołań do Godota"

      - name: Core has no NuGet dependencies
        shell: bash
        # Dyscyplina bezzależnościowa rdzenia. Pakiety są dozwolone wyłącznie
        # w projekcie testowym. Szukamy elementu XML, a nie samego słowa: komentarz
        # w Sim.csproj wyjaśnia właśnie tę regułę i sam zawiera to słowo.
        run: |
          set -euo pipefail
          test -f src/Sim/Sim.csproj || { echo "brak src/Sim/Sim.csproj — bramka NuGet nie ma czego sprawdzić" >&2; exit 1; }
          if grep -nE '<[[:space:]]*PackageReference' src/Sim/Sim.csproj; then
            echo "src/Sim dostał zależność NuGet — to wymaga decyzji, nie commita" >&2
            exit 1
          fi
          echo "src/Sim: zero PackageReference"

      - name: Reference parity is still reproducible from Python
        shell: bash
        # Snapshot liczb referencyjnych żyje w tests/Sim.Tests/PythonReference.cs
        # i jest ręcznie przepisany. Do 2026-09 ten krok był samym `print`: obcięcie
        # mocy trakcji w reference.py o 10 % przesuwało drogę rozruchu z 337,5 m
        # na 371,3 m, a `dotnet test` dalej dawał Passed: 252. Teraz test przelicza
        # wszystkie 24 stałe od nowa i porównuje je z plikiem C# na pełnej precyzji,
        # więc rozjazd wywraca job zamiast przewijać się w logu.
        run: |
          set -euo pipefail
          python3 tools/physics/reference.py
          python3 tools/tests/test_reference_snapshot.py

      - name: Braking reference matches the core byte for byte
        shell: bash
        # T-311: tablice hamowania powstają dwa razy — raz w rdzeniu (src/Sim.Runner
        # braking), raz w niezależnej referencji Pythona (tools/physics/braking.py).
        # To nie jest wydruk do logu, tylko bramka: `diff` wywraca job, gdy obie drogi
        # przestaną dawać tę samą liczbę.
        run: |
          set -euo pipefail
          dotnet run --project src/Sim.Runner --configuration Release --no-build -- braking > /tmp/braking_core.txt
          python3 tools/physics/braking.py > /tmp/braking_reference.txt
          diff -u /tmp/braking_reference.txt /tmp/braking_core.txt
          echo "tablice hamowania: rdzeń == referencja, co do bajtu"
