name: Neutral material style smoke

on:
  pull_request:
    paths:
      - '.github/workflows/material-style-smoke.yml'
      - 'data/design/visual-style.json'
      - 'docs/20-art-direction.md'
      - 'tools/blender/material_test_scene.py'
      # Cały tools/ci, nie pojedynczy skrypt: job uruchamia też apt_install.sh,
      # blender_install.sh i listy pakietów. Przy wąskim wzorcu zmiana takiego
      # pliku nie odpalała własnego CI.
      - 'tools/ci/**'
      - 'tools/tests/**'
      # Katalog akcji lokalnych, z tego samego powodu co `tools/ci/**` wyżej —
      # 6.D78. Ten job wykonuje treść `.github/actions/*/action.yml` tak samo, jak
      # wykonuje skrypty z `tools/ci/`, a bez tego wzorca zmiana akcji nie odpalała
      # ani jednego joba, który jej używa. Zmierzone 09.09.2026: siedem workflowów
      # z filtrem, siedem luk. Sonda narzędzi nie miała ANI JEDNEGO konsumenta bez
      # filtra, więc jej zmiana nie była przed scaleniem wykonywana wcale.
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material-style:
    # Ten job chodzi na MASZYNIE WŁAŚCICIELA, nie na jednorazowej maszynie GitHuba.
    # Kroki wykonują kod ze sprawdzonego refa — `tools/**`, `doctor.sh`, skrypty CI —
    # więc bez tego warunku wystarczyłby pull request z forka, żeby uruchomić tam
    # dowolny kod. `metro.brussels` jest prywatne, ale ma WŁĄCZONE forkowanie
    # (`allow_forking: true`), więc uzasadnienie „forka nie da się zrobić" tu nie
    # obowiązuje. Warunek nosi KAŻDY job; `needs:` nie jest zamiennikiem, bo job
    # dopisany bez łańcucha zależności nie miałby żadnej ochrony.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout
        # 6.D108: PEŁNA historia, nie domyślna głębokość 1 — decyzja właściciela
        # z 10.09.2026. `tools/tests/test_report_claims.py` rozstrzyga, czy zdanie
        # raportu mówi o wartości BIEŻĄCEJ stałej, czy o wartości Z DNIA POMIARU,
        # po dacie ostatniej zmiany tej stałej w gicie. Przy głębokości 1 nie ma
        # czego przeszukać: KAŻDA stała wygląda wtedy na zmienioną w jedynym
        # widocznym commicie, więc przyrząd odpowiadałby, nie sprawdziwszy niczego.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Kontrola czystego workspace: JEDNA implementacja w
      # `.github/actions/check-workspace`, nie kopia w każdym workflow. Powód
      # i mechanika są w samej akcji.
      - name: Workspace jest czysty po checkoucie
        uses: ./.github/actions/check-workspace

      # Sonda narzędzi: JEDNA implementacja w `.github/actions/probe-tools`.
      # Wyjście `libs` ma tę samą umowę co przed wydzieleniem, więc warunki
      # `if: steps.tools.outputs.libs == 'missing'` niżej zostają bez zmian.
      - name: Czy biblioteki systemowe renderu już są
        id: tools
        uses: ./.github/actions/probe-tools
        with:
          libraries: libEGL.so.1 libGL.so.1 libX11.so.6 libXext.so.6 libXrender.so.1 libXfixes.so.3 libXi.so.6 libxkbcommon.so.0 libICE.so.6 libSM.so.6
          commands: curl

      - name: Cache pakietów apt
        if: steps.tools.outputs.libs == 'missing'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/metro-apt
          key: apt-${{ runner.os }}-blender-${{ hashFiles('tools/ci/apt-packages/blender.txt') }}
          restore-keys: apt-${{ runner.os }}-blender-

      - name: Install render libraries
        if: steps.tools.outputs.libs == 'missing'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export APT_CACHE_DIR="$HOME/.cache/metro-apt"
          bash tools/ci/apt_install.sh --set blender
          # Bramka, nie ozdoba: pod `pipefail` brak biblioteki kończy krok błędem.
          # Poprzednia wersja miała tu `|| true`, czyli wypisywała i przemilczała.
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1'

      # Blender w PRZYPIĘTEJ wersji, z oficjalnego tarballa, POZA workspace.
      #
      # Bez `if:`, i to jest celowe. Skrypt jest własną sondą: czyta numer z
      # `tools/ci/blender-version.txt`, porównuje go z tym, co faktycznie stoi w jego
      # katalogu, i pobiera tylko przy rozjeździe. Gdy wersja się zgadza, kończy w 0,12 s.
      # Bramkowanie tego `if:` z workflow oznaczałoby drugą, słabszą sondę obok mocnej.
      #
      # Katalog jest poza workspace, bo `actions/checkout` robi `git clean -ffdx`,
      # a `-x` obejmuje pliki ignorowane — Blender w workspace schodziłby z sieci
      # (366 MB) raz na przebieg. Ta sama decyzja i ten sam katalog co przy Godocie.
      - name: Blender w przypiętej wersji
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bin="$(bash tools/ci/blender_install.sh)"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version | sed -n '1,2p'
          "$bin" --background --python-expr 'import numpy; print("numpy", numpy.__version__)'

      # CO TU SPRAWDZA BRAMKA, A CZEGO NIE SPRAWDZAŁA POPRZEDNIA WERSJA.
      #
      # Ten workflow przyszedł z gałęzi `t-902-art-direction` i jest tu PRZEPISANY,
      # nie przeniesiony. W wersji źródłowej całą weryfikacją generatora były cztery
      # `test -s` na plikach wyjściowych. To jest dokładnie ten kształt, który
      # `CLAUDE.md` §5 wymienia jako zakazany: plik niezerowej długości powstaje też
      # z pustej sceny, bo render czarnej klatki waży swoje. Na współdzielonym
      # workspace self-hosted runnera przechodził go dodatkowo plik z POPRZEDNIEGO
      # przebiegu — a workflow nie miał kroku, który by to zauważył.
      #
      # Żadna z bramek ODMOWY generatora nie była sprawdzana nigdy i nigdzie:
      # puste `material_presets`, powtórzone identyfikatory, brak materiału
      # wymaganego przez kamerę `close`, render mniejszy niż 1024 B. Każda z nich
      # potrzebuje uruchomionego Blendera, więc testy jednostkowe — które na gałęzi
      # źródłowej czytały wyłącznie `data/design/visual-style.json` — nie mogły
      # wykonać ani jednej.
      #
      # Sam job też nie spełniał §9: etykiety `[self-hosted, linux, x64]` zamiast
      # gołego `self-hosted`, brak warunku odrzucającego pull requesty z forków,
      # akcje przypięte po tagu (`@v6`, `@v4`), sonda `command -v blender` (czyli
      # 4.0.2 z apt, legacy EEVEE), kontrola `/proc/version` na WSL2 z maszyny
      # wyłączonej 02.08.2026 i `if-no-files-found: warn`, czyli upload, który
      # nie znajduje nic i tylko o tym wspomina.

      - name: Generate the neutral material grid and check it
        shell: bash
        run: bash tools/ci/material_style.sh

      - name: Upload T-902 verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t-902-material-style-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/style/
            renders/style_*.png
          if-no-files-found: error
          retention-days: 7
