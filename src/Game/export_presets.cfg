; METRO BXL — preset eksportu paczki dla gracza (MB-04, 14.09.2026).
;
; TEN PLIK BYŁ W `.gitignore` I TO NIE BYŁ PRZYPADEK — wiersz 31 stał w sekcji
; „wszystko, co silnik generuje obok projektu". Preset faktycznie generuje edytor,
; ale od MB-04 jest on WEJŚCIEM procesu pakowania, a nie jego wytworem: bez niego
; `--export-pack` i `--export-release` kończą się błędem
; „This project doesn't have an `export_presets.cfg` file at its root". Wyjątek
; w `.gitignore` jest więc dokładny (`!src/Game/export_presets.cfg`), a nie zdjęcie
; całego wiersza — inne projekty Godota w drzewie mają zostać ignorowane.
;
; NAZWA PLATFORMY W 4.7.2 TO "Linux", a nie "Linux/X11" jak w 4.0–4.2. Zmierzone,
; nie zapamiętane: preset z dawną nazwą jest przyjmowany, a eksport kończy się
; komunikatem o braku platformy.
;
; `include_filter` i `exclude_filter` MUSZĄ tu stać, choćby puste. Bez nich każdy
; eksport wypisuje `Couldn't find the given section "preset.0" and key
; "include_filter"` — to nie jest błąd krytyczny, ale zaśmieca log, przez który
; szuka się błędów prawdziwych.
;
; `script_export_mode=2` to binarny bajtkod. Przy `dotnet/include_scripts_content=false`
; źródła C# i tak nie jadą, ale ta liczba jest tu jawnie, żeby zmiana domyślnej
; w przyszłym Godocie nie wsadziła ich z powrotem po cichu.

